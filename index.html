<style>
  :root{--bg:#f4f7fb;--fg:#10223d;--muted:#4a5b75;--primary:#1b6ad0;--card:#fff;--line:#d7e0ee}

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
  main{max-width:28rem;width:100%;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center}
  h1{margin:0 0 8px;font-size:1.35rem}
  p{margin:0 0 16px;color:var(--muted)}
  a{display:inline-block;margin:4px 8px;padding:10px 18px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;text-decoration:none}
  @media (prefers-color-scheme:dark){a{color:#06101f}}
  a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
