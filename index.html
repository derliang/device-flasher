<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Flasher</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2430;--mut:#5b6573;--card:#fff;--bd:#d9dee5}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--fg:#e8ecf1;--mut:#9aa6b4;--card:#1b212a;--bd:#2d3643}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:34rem;margin:16px;padding:28px 24px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
h1{margin:0 0 8px;font-size:1.5rem}
p{margin:.5rem 0}.mut{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Device Flasher</h1>
<p><strong>建置中</strong>：線上備份、更新、還原 ESP32-C3 與 ESP8266 韌體。</p>
<p class="mut">全部在瀏覽器本機執行，不上傳資料。需電腦版 Chrome 或 Edge 與 USB。</p>
<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
<p><strong>Under construction</strong>: back up, update and restore ESP32-C3 and ESP8266 firmware online.</p>
<p class="mut">Runs entirely in your browser; nothing is uploaded. Requires desktop Chrome or Edge and USB.</p>
</main>
</body>
</html>
