# 紅外線遙控器：M5Stack ATOM Lite（ESP32-PICO-D4，4 MB flash）。共用內容在 ir-remote-common.yaml。
# 腳位（M5Stack 官方文件）：紅外線發射 LED＝GPIO12。接收頭接 Grove 孔的 GPIO26（黃線）；兩個腳位都可用 ir_tx_pin、ir_rx_pin 覆寫。
# 板上沒有紅外線接收元件。日誌與 improv_serial 走 UART0（板上 USB 轉序列晶片）。
substitutions:
  devicename: ir-remote
  upper_devicename: IR Remote
  mac_suffix: "true"
  ir_tx_pin: GPIO12
  ir_rx_pin: GPIO26

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

packages:
  common: !include ir-remote-common.yaml

improv_serial:
