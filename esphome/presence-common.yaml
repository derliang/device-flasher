# 裝置端底噪校準：離開房間後開始，期間開工程模式取樣各格最大能量，
# 結束時把「最大值＋餘裕」寫回各格門檻（上限 100），再關工程模式。
script:
  # 4.2：依目前狀態重新同步「跟著感測器」的兩組燈（左三顆＝雷達有人、右三顆＝PIR）。
  # 補三個原本不會自己補亮的時機：①LED Follow Sensors 剛打開（人已在場）②Wi-Fi 連上、狀態燈熄整排之後 ③校準結束、狀態燈熄整排之後。
  # 左右燈是 ws2812 整條的分段，熄整排會連帶熄掉它們；校準中與 Wi-Fi 斷線閃紅時燈歸狀態燈管，不同步
  - id: led_sync
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(led_follow).state && !id(cal_running) && !(id(led_status).state && !wifi::global_wifi_component->is_connected());'
          then:
            - if:
                condition:
                  binary_sensor.is_on: presence
                then:
                  - light.turn_on:
                      id: ws2812_left
                      brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                      effect: "Left Flow"
                else:
                  - light.turn_off: ws2812_left
            - if:
                condition:
                  binary_sensor.is_on: motion
                then:
                  - light.turn_on:
                      id: ws2812_right
                      brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                      effect: "Right Flow"
                else:
                  - light.turn_off: ws2812_right
  # 2.8: radar link recovery: restart the radar (3 tries, 30 s apart), rest 10 min, again, then restart the ESP once
  - id: link_recover
    mode: single
    then:
      - delay: 10s
      - lambda: 'id(link_attempts) = 0;'
      - while:
          condition:
            lambda: 'return !id(link_was_ok);'
          then:
            - lambda: 'id(link_attempts)++;'
            - button.press: radar_restart_btn
            - delay: 30s
            - if:
                condition:
                  lambda: 'return !id(link_was_ok) && id(link_attempts) >= 6;'
                then:
                  - button.press: esp_restart_btn
            - if:
                condition:
                  lambda: 'return !id(link_was_ok) && id(link_attempts) % 3 == 0;'
                then:
                  - delay: 10min
      # 4.3.1：雷達恢復後確認參數有讀回（沒讀回就自動重讀）
      - script.execute: ensure_params
  # 4.3.1：確認雷達參數（最大格數、門檻）有讀回。開機約 20 秒後檢查；沒讀回就按 Radar Query Params，
  # 等 10 秒看結果，沒好再等 20 秒，最多 10 次。開機或雷達重啟當下那一次讀取沒成功時，這些值會一直停在 0
  - id: ensure_params
    mode: restart
    then:
      - delay: 20s
      - repeat:
          count: 10
          then:
            - if:
                condition:
                  lambda: 'return id(radar_max_move).state >= 2 && id(radar_max_still).state >= 2;'
                then:
                  - script.stop: ensure_params
            - lambda: 'ESP_LOGW("params", "radar parameters not read, pressing Radar Query Params");'
            - button.press: radar_query_btn
            - delay: 10s
            - if:
                condition:
                  lambda: 'return id(radar_max_move).state >= 2 && id(radar_max_still).state >= 2;'
                then:
                  - script.stop: ensure_params
            - delay: 20s
  # 2.5: zone occupancy is recomputed only when an input changes (was a 60 s poll)
  - id: zone_eval
    mode: restart
    then:
      - lambda: |-
          bool z[2] = {false, false};
          if (id(presence).state) {
            float res = ${radar_res_m};
            int ga = -1, gb = -1;
            if (id(radar_moving).state && !std::isnan(id(radar_move_dist).state)) ga = (int) (id(radar_move_dist).state / res);
            if (id(radar_still).state && !std::isnan(id(radar_still_dist).state)) gb = (int) (id(radar_still_dist).state / res);
            int a1 = (int) id(zone1_start).state, b1 = (int) id(zone1_end).state;
            int a2 = (int) id(zone2_start).state, b2 = (int) id(zone2_end).state;
            z[0] = (ga >= a1 && ga <= b1) || (gb >= a1 && gb <= b1);
            z[1] = (ga >= a2 && ga <= b2) || (gb >= a2 && gb <= b2);
            // 4.0：旗標掉線橋接中雷達沒有目標位置，區輸出維持掉線前的值，不要 4 秒後就放開（人其實還在）
            // 4.3：旗標掉線事件可能先觸發區域重算，這時 bridging 還是上一圈的 false；
            // 所以也直接看「雷達旗標已關但整體仍有人」，不依賴元件更新順序
            if (id(bridging) || !id(presence_raw).state) { z[0] = id(zone1_occupied).state; z[1] = id(zone2_occupied).state; }
          }
          // 3.8：有人時，區輸出從有人轉無人要先保持 Zone Hold Seconds 秒（1 秒檢查一次放開）；整體無人時立刻放開
          uint32_t now = millis();
          uint32_t hold = (uint32_t) (std::max(0.0f, id(zone_hold_s).state) * 1000.0f);
          binary_sensor::BinarySensor *zo[2] = {id(zone1_occupied), id(zone2_occupied)};
          for (int i = 0; i < 2; i++) {
            id(zone_raw)[i] = z[i] ? 1 : 0;
            if (z[i]) id(zone_last)[i] = now;
            if (z[i] || !id(presence).state || hold == 0 || !zo[i]->state || now - id(zone_last)[i] >= hold) zo[i]->publish_state(z[i]);
          }
  # N9: PIR motion but radar still says empty 3 s later -> one mismatch
  - id: pir_check
    mode: queued
    max_runs: 4
    then:
      - delay: !lambda 'return (uint32_t) (id(pir_mismatch_s).state * 1000.0f);'
      - if:
          condition:
            binary_sensor.is_off: presence
          then:
            - lambda: 'id(pir_mismatch)++;'
            - binary_sensor.template.publish:
                id: pir_mm_now
                state: ON
            - script.execute: pir_mm_off
  # 3.3：PIR Mismatch Now 開 10 秒後自動關
  - id: pir_mm_off
    mode: restart
    then:
      - delay: 10s
      - binary_sensor.template.publish:
          id: pir_mm_now
          state: OFF
  # 3.3：雷達重開後的穩定期（12 秒）
  - id: radar_settle
    mode: restart
    then:
      - lambda: 'id(settle_on) = true;'
      - binary_sensor.template.publish:
          id: radar_settling
          state: ON
      - delay: !lambda 'return (uint32_t) (id(settle_s).state * 1000.0f);'
      - lambda: 'id(settle_on) = false;'
      - binary_sensor.template.publish:
          id: radar_settling
          state: OFF
  # N11: called every 1 s from interval (2.9).
  # 2.8 field test showed: (a) leaving, the radar reports a still-only target far away
  # (moving flag off), so "moving and far" never fired; (b) at the desk both flags are usually on, so "still only"
  # flickered and the timeout was rewritten every 30-60 s; (c) every timeout write restarts the radar
  # (ld2410.cpp set_max_distances_timeout -> restart_and_read_all_info), blind for 2-3 s, once causing a false
  # "absent" while seated. 2.9 rules:
  #   extend  : still target within the near range for 10 s in a row (moving flag ignored)
  #   shorten : every reported target beyond the near range for 2 s in a row (still or moving)
  #   neither : keep the current timeout while someone is present (no write); restore base once presence is off
  # Writes are limited to one per 30 s, except shorten (one per 5 s) so leaving is not blocked by a recent extend.
  - id: smart_delay_tick
    mode: single
    then:
      - lambda: |-
          id(smart_wrote) = false;
          uint32_t now = millis();
          float res = ${radar_res_m};
          int near_g = (int) id(delay_near).state;
          // ---- 3.2 觀察（不論智慧延時開關都算，供狀態顯示與網頁說明）----
          float se = id(radar_still_energy).state;
          int rw = std::max(1, std::min(60, (int) id(residue_window).state));
          int si = id(se_idx) % rw;
          float se10 = id(se_hist)[si];
          id(se_hist)[si] = (std::isnan(se) || !id(presence_raw).state) ? -1.0f : se;
          id(se_idx) = (id(se_idx) + 1) % 6000;
          float sd = id(radar_still_dist).state, md = id(radar_move_dist).state;
          bool s_ok = id(radar_still).state && !std::isnan(sd), m_ok = id(radar_moving).state && !std::isnan(md);
          bool s_near = s_ok && (int) (sd / res) <= near_g, m_near = m_ok && (int) (md / res) <= near_g;
          bool far_only = (s_ok || m_ok) && !s_near && !m_near;
          // 殘留回波：沒有移動目標、PIR 5 秒沒觸發（delayed_off 5s）、靜止能量 10 秒內降 ≥Residue Drop 且低於 Residue Max Energy，
          // 連續 Residue Confirm Seconds 秒成立；成立後只要能量不回升（>最低點+Residue Rebound）、沒有移動或 PIR 就維持，最多 Residue Max Seconds 秒
          // 3.4：五個常數改可調，預設 8／60／3／5／60 與 3.3 相同（無回放可比，靠編譯與逐項核對）
          // 4.0.2：Residue Max Energy 預設 60→35。坐下或定下來的人，靜止能量常從 100 掉到 40–55 後穩定，舊上限 60 會把這個
          //       正常沉降誤判成「離開殘留」→ 先判無人、橋接也被擋。
          //       真的離開時能量會掉到底噪（約 10）附近，仍低於 35。
          bool quietish = id(presence_raw).state && !id(radar_moving).state && !id(motion).state && !std::isnan(se);
          // 4.1.1：Residue Drop 0＝關閉殘留規則
          float rdrop = id(residue_drop).state;
          if (std::isnan(rdrop) || rdrop <= 0) { id(residue) = false; id(residue_s) = 0; }
          else if (id(residue)) {
            if (!quietish || se > id(residue_min) + id(residue_rebound).state || now - id(residue_since) > (uint32_t) (id(residue_max_s).state * 1000.0f)) { id(residue) = false; id(residue_s) = 0; }
            else id(residue_min) = std::min(id(residue_min), se);
          } else {
            bool dec = quietish && se10 >= 0 && se <= se10 - rdrop && se < id(residue_max_e).state;
            id(residue_s) = dec ? id(residue_s) + 1 : 0;
            if (id(residue_s) >= (int) id(residue_confirm_s).state) { id(residue) = true; id(residue_min) = se; id(residue_since) = now; ESP_LOGI("smart", "departure residue: still energy %.0f (10 s ago %.0f)", se, se10); }
          }
          // 4.1.1：座位距離＝最近 60 秒（有人且有靜止目標的那些秒）靜止距離的中位數，給離座軌跡判斷用
          {
            id(seat_hist)[id(seat_idx)] = (id(presence).state && s_ok) ? sd : 0.0f;
            id(seat_idx) = (id(seat_idx) + 1) % 60;
            float sv[60]; int sn = 0;
            for (int k = 0; k < 60; k++) if (id(seat_hist)[k] > 0) sv[sn++] = id(seat_hist)[k];
            id(seat_n) = sn;
            if (sn == 0) id(seat_cm) = 0;
            else { std::sort(sv, sv + sn); id(seat_cm) = (sn % 2) ? sv[sn / 2] : (sv[sn / 2 - 1] + sv[sn / 2]) / 2.0f; }
          }
          // 4.1.1：雷達旗標關著但靜止能量夠高的連續秒數（Radar Presence 範本用）
          {
            float ep = id(energy_pres).state;
            id(e_run) = (!id(presence_raw).state && !std::isnan(ep) && ep > 0 && !std::isnan(se) && se >= ep) ? std::min(id(e_run) + 1, 1000) : 0;
          }
          // 4.0：單秒距離突跳 >= 1.5 格的遠處目標是鬼影或跳格，不算「遠離」（真的離開是逐步走遠）；
          // 封鎖到看見近處目標，或遠處持續 10 秒（慢慢真的走掉）為止
          {
            float dnow = NAN;
            if (s_ok) dnow = sd;
            if (m_ok && (std::isnan(dnow) || md < dnow)) dnow = md;
            int dcm = std::isnan(dnow) ? 0 : (int) dnow;
            if (!id(presence).state || s_near || m_near) { id(far_block) = false; id(far_block_s) = 0; }
            else if (far_only && !id(far_block) && id(smart_far_s) == 0 && id(smart_prev_d) > 0 && dcm - id(smart_prev_d) >= (int) (res * 150.0f)) { id(far_block) = true; id(far_block_s) = 0; }
            if (id(far_block)) { id(far_block_s) = far_only ? id(far_block_s) + 1 : id(far_block_s); if (id(far_block_s) >= 10) id(far_block) = false; }
            id(smart_prev_d) = dcm;
          }
          if (!id(presence).state) { id(smart_near_s) = 0; id(smart_far_s) = 0; }
          else {
            id(smart_near_s) = s_near ? std::min(id(smart_near_s) + 1, 1000) : 0;
            id(smart_far_s) = (far_only && !id(far_block)) ? std::min(id(smart_far_s) + 1, 1000) : 0;
          }
          // 狀態：0 Empty、1 Entering（轉有人 10 秒內）、2 Moving、3 Still（近處靜止滿 10 秒）、4 Leaving（殘留或只剩遠處 2 秒）
          int stt;
          if (!id(presence).state) stt = 0;
          else if (id(residue) || id(smart_far_s) >= (int) id(delay_away_s).state) stt = 4;
          else if (id(smart_near_s) >= (int) id(delay_still_s).state) stt = 3;
          else if (now - id(pres_on_ms) < (uint32_t) (id(entering_s).state * 1000.0f)) stt = 1;
          else stt = 2;
          id(pres_state) = stt;
          // 3.8：對外顯示的狀態字要連續維持 State Smooth Seconds 秒才換（變成 Empty 立即換）；判斷與逾時邏輯仍用即時的 stt
          {
            int sm = std::max(0, (int) id(state_smooth_s).state);
            if (stt == id(pres_cand)) id(pres_cand_s) = std::min(id(pres_cand_s) + 1, 1000);
            else { id(pres_cand) = stt; id(pres_cand_s) = 1; }
            // 4.0：從 Empty 變有人立即換（presence 已 ON 文字卻還是 Empty 的 3–4 秒是矛盾的），只有「有人狀態之間」才平滑
            if (stt != id(pres_shown) && (stt == 0 || id(pres_shown) <= 0 || id(pres_cand_s) > sm)) {
              static const char *const NM[5] = {"Empty", "Entering", "Moving", "Still", "Leaving"};
              id(pres_shown) = stt;
              id(pres_state_text).publish_state(NM[stt]);
            }
          }
          // 為什麼判定有人（網頁用）
          {
            // 3.5：用堆疊上的字元陣列組字串（原本每秒配置一次 std::string），內容沒變就不送
            char rs[96];
            rs[0] = '\0';
            if (id(presence_raw).state || id(presence).state) {
              number::Number *mt[9] = {${gates_thr_move_9}};
              number::Number *st[9] = {${gates_thr_still_9}};
              size_t n = 0;
              // 3.6：門檻還沒讀回（NaN）時，(int) 轉型是未定義行為；改輸出 -1，網頁遇 -1 不顯示門檻比較
              auto thr = [](number::Number *e) { float v = e->state; return std::isnan(v) ? -1 : (int) v; };
              float me = id(radar_move_energy).state;
              if (m_ok && !std::isnan(me)) { int g = std::min(8, (int) (md / res)); n += snprintf(rs + n, sizeof(rs) - n, "m,%d,%d,%d;", g, (int) me, thr(mt[g])); }
              if (s_ok && !std::isnan(se)) { int g = std::min(8, (int) (sd / res)); n += snprintf(rs + n, sizeof(rs) - n, "s,%d,%d,%d;", g, (int) se, thr(st[g])); }
              snprintf(rs + n, sizeof(rs) - n, "p,%d;r,%d;h,%d;b,%d", id(motion).state ? 1 : 0, id(residue) ? 1 : 0, (!id(presence_raw).state && id(presence).state) ? 1 : 0, id(bridging) ? 1 : 0);
            }
            if (!id(pres_reason).has_state() || strcmp(id(pres_reason).state.c_str(), rs) != 0) id(pres_reason).publish_state(rs);
          }
          // ---- 逾時 ----
          if (!id(radar_timeout_hw).has_state()) return;
          float hw = id(radar_timeout_hw).state;
          // 第一次開機（3.1 剛燒）：範本數字取雷達現值，之後以範本為準
          if (!id(tmo_synced)) {
            float v = (id(smart_active) && id(smart_base) > 0.5f) ? id(smart_base) : hw;
            auto c0 = id(radar_timeout).make_call(); c0.set_value(v); c0.perform();
            id(tmo_synced) = true;
            return;
          }
          float base = id(radar_timeout).state;
          if (std::isnan(base)) return;
          // 3.3：逾時預設選單跟著目前的逾時值
          {
            const char *pn = fabsf(base - 60) < 0.5f ? "Work 60 s" : fabsf(base - 120) < 0.5f ? "Sleep 120 s" : fabsf(base - 5) < 0.5f ? "Away 5 s" : "Custom";
            if (id(timeout_preset).current_option() != pn) id(timeout_preset).publish_state(pn);
          }
          auto set_mode = [&](const char *m) { if (!id(smart_mode_ts).has_state() || id(smart_mode_ts).state != m) id(smart_mode_ts).publish_state(m); };
          auto write_hw = [&](float v) {
            id(smart_wrote) = true;
            id(smart_eng) = id(ld2410_engineering).state;
            id(radar_settle).execute();
            auto call = id(radar_timeout_hw).make_call();
            call.set_value(v);
            call.perform();
          };
          if (!id(smart_delay).state) {
            id(smart_mode) = 0; id(residue) = false; id(residue_s) = 0;
            set_mode("off");
            if (id(presence_hold).state != base) id(presence_hold).publish_state(base);
            if (id(smart_active)) { id(smart_active) = false; write_hw(base); }
            else if (fabsf(hw - base) > 0.5f && now - id(smart_last_ms) > (uint32_t) (id(smart_write_gap_s).state * 1000.0f)) { id(smart_last_ms) = now; write_hw(base); }
            return;
          }
          if (!id(smart_active) || fabsf(hw - 1.0f) > 0.5f) {
            if (id(smart_last_ms) != 0 && now - id(smart_last_ms) < (uint32_t) (id(smart_write_gap_s).state * 1000.0f)) return;
            id(smart_active) = true; id(smart_last_ms) = now;
            write_hw(1.0f);
          }
          // 每個狀態的逾時：Leaving＝縮短、Still＝延長、Entering＝基本；Moving 沿用上一個（短暫起身不取消延長）
          int want = id(smart_mode);
          if (stt == 0 || stt == 1) want = 0;
          else if (stt == 4) want = 2;
          else if (stt == 3) want = 1;
          // 4.3：Moving 沿用上一個「延長」（短暫起身不取消），但不沿用「縮短」：遠處讀到 2 秒就把保持縮成 2 秒，
          // 人又動了、近處有目標，卻要等近處靜止滿 10 秒才恢復
          else if (stt == 2 && want == 2) want = 0;
          id(smart_mode) = want;
          set_mode(want == 1 ? "extended" : want == 2 ? "shortened" : "normal");
          float target = base;
          if (want == 1) target = base + id(delay_extend).state;
          else if (want == 2) target = std::max(0.0f, base - id(delay_shorten).state);
          // 雷達底層自己還有 1 秒，所以 ESP32 這邊少算 1 秒
          id(hold_ms) = (uint32_t) (std::max(0.0f, target - 1.0f) * 1000.0f);
          if (id(presence_hold).state != target) id(presence_hold).publish_state(target);
      - if:
          condition:
            lambda: 'return id(smart_wrote) && id(smart_eng);'
          then:
            - script.execute: smart_eng_reopen
  # 2.9: separate script so the 1 s tick is not blocked (mode single) during the 4 s wait
  - id: smart_eng_reopen
    mode: restart
    then:
      - delay: 4s
      - if:
          condition:
            switch.is_off: ld2410_engineering
          then:
            - lambda: 'id(eng_reopen) = true;'
            - switch.turn_on: ld2410_engineering
  # 工程模式保險：開啟後 N 分鐘自動關（校準進行中等校準結束；每次重新開啟重新計時）
  - id: eng_auto_off
    mode: restart
    then:
      - lambda: |-
          auto tm = id(sntp_time).now();
          if (tm.is_valid()) id(eng_off_at).publish_state(ESPTime::from_epoch_utc(tm.timestamp + (int) (id(eng_auto_off_min).state * 60)).strftime("%Y-%m-%dT%H:%M:%SZ"));
      - delay: !lambda 'return (uint32_t) (id(eng_auto_off_min).state * 60000);'
      - while:
          condition:
            lambda: 'return id(cal_running);'
          then:
            - delay: 5s
      - if:
          condition:
            switch.is_on: ld2410_engineering
          then:
            - switch.turn_off: ld2410_engineering
  # 3.3 還原設定。最佳值：參數回建議值，18 個門檻、溫濕度補償、藍牙、歷史資料不動。
  # 出廠：雷達模組恢復出廠（門檻、最遠格、逾時、藍牙回原廠）、參數回韌體初始值（智慧延時關）、清除校準結果與歷史學習資料。
  - id: restore_settings
    mode: single
    parameters:
      factory: bool
    then:
      - if:
          condition:
            lambda: 'return id(cal_running);'
          then:
            - lambda: 'id(restore_status_ts).publish_state("busy");'
            - script.stop: restore_settings
      - lambda: |-
          id(restore_status_ts).publish_state(factory ? "running_factory" : "running_recommended");
          auto n = [](number::Number *e, float v) { auto c = e->make_call(); c.set_value(v); c.perform(); };
          n(id(radar_timeout), 5);
          n(id(delay_near), 3); n(id(delay_extend), 10); n(id(delay_shorten), 2);
          n(id(delay_still_s), 10); n(id(delay_away_s), 2); n(id(hyst_margin), 5); n(id(spike_window), 30);
          for (auto &d : std::vector<std::pair<number::Number *, float>>{
              {id(floor_wait_s), 60}, {id(floor_window), 180}, {id(floor_every_min), 30}, {id(occ_every_min), 60}, {id(pir_recent_s), 300},
              {id(hist_start_s), 180}, {id(hist_quiet_s), 600}, {id(hist_apply_days), 7}, {id(hist_clamp_step), 10}, {id(hist_min_q), 20000},
              {id(hist_min_occ), 300}, {id(hist_pct_empty), 99.9f}, {id(hist_pct_occ), 10}, {id(seat_gap), 2}, {id(cal_abort_wait_s), 5},
              {id(cal_abort_energy), 90}, {id(cal_abort_s), 1}, {id(cal_sit_wait_s), 90}, {id(cal_sit_confirm_s), 3}, {id(cal_verify_s), 3},
              {id(residue_window), 10}, {id(pir_hold_s), 5}, {id(smart_write_gap_s), 30}, {id(settle_s), 12}, {id(pir_mismatch_s), 3}})
            n(d.first, d.second);
          n(id(cal_spread_limit), 20); n(id(intf_ratio), 2.5); n(id(intf_gap), 10);
          n(id(residue_drop), 0); n(id(residue_max_e), 35); n(id(residue_rebound), 5); n(id(residue_confirm_s), 4); n(id(residue_max_s), 60); n(id(entering_s), 10); n(id(zone_hold_s), 4); n(id(state_smooth_s), 3); n(id(cal_abort_spread), 40); n(id(entry_confirm_s), 2); n(id(bridge_e), 60); n(id(bridge_s), 60); n(id(led_brightness), 30); n(id(lost_hold_s), 180); n(id(energy_pres), 30); n(id(exit_near), 0); n(id(exit_far), 0); n(id(exit_win_s), 0); n(id(exit_e), 15);
          n(id(zone1_start), 0); n(id(zone1_end), 3); n(id(zone2_start), 4); n(id(zone2_end), 8);
          n(id(cal_delay), 15); n(id(cal_duration), 120); n(id(cal_sit_duration), 30); n(id(cal_margin), 10);
          n(id(eng_auto_off_min), 10); n(id(radar_link_timeout), 5); id(cal_two).turn_off();
          n(id(buzzer_volume), 80);
          auto m = id(buzzer_melody).make_call(); m.set_value("motion:d=32,o=6,b=200:e,16p,g"); m.perform();
          if (factory) id(smart_delay).turn_off(); else id(smart_delay).turn_on();
          id(hist_learn).turn_on(); id(hist_auto).turn_off(); id(cal_block_unstable).turn_on();
          id(sounds).turn_off(); id(hourly_chime).turn_off(); id(led_follow).turn_off(); id(led_status).turn_off();
      - light.turn_off: ws2812
      - if:
          condition:
            lambda: 'return factory;'
          then:
            - button.press: hist_reset_btn
            - lambda: |-
                id(cal_status).publish_state("");
                id(cal_phase_ts).publish_state("idle");
                id(cal_fail_ts).publish_state("none");
                id(cr_samples).publish_state(NAN);
                id(cr_seat_gates).publish_state(NAN);
                id(cal_finished_at).publish_state("");
                id(calibration_done).turn_off();
                id(cal_bak_ok) = false; id(cal_bak_at) = 0;
                id(cal_backup_text).publish_state("");
                id(cal_backup_at_ts).publish_state("");
            - button.press: radar_factory_reset_btn
            - script.execute: radar_settle
            - delay: 5s
            - button.press: radar_query_btn
          else:
            - number.set:
                id: radar_max_move
                value: 8
            - delay: 1s
            - number.set:
                id: radar_max_still
                value: 8
            - script.execute: radar_settle
      - delay: 3s
      - lambda: 'id(restore_status_ts).publish_state(factory ? "done_factory" : "done_recommended");'
  # 記錄一次有人／無人轉換（最近 20 筆）
  - id: log_trigger
    mode: queued
    max_runs: 4
    parameters:
      present: bool
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          std::string ts = now.is_valid() ? now.strftime("%m-%d %H:%M:%S") : std::string("--");
          float d = id(radar_detect_dist).state, me = id(radar_move_energy).state, se = id(radar_still_energy).state;
          char line[64];
          snprintf(line, sizeof(line), "%s,%d,%d,%d,%d\n", ts.c_str(), present ? 1 : 0,
                   std::isnan(d) ? -1 : (int) d, std::isnan(me) ? -1 : (int) me, std::isnan(se) ? -1 : (int) se);
          std::string buf = std::string(line) + id(trigger_log_buf);
          int n = 0;
          size_t pos = 0;
          while ((pos = buf.find('\n', pos)) != std::string::npos) {
            if (++n >= 20) { buf.resize(pos + 1); break; }
            pos++;
          }
          id(trigger_log_buf) = buf;
          id(trigger_log_text).publish_state(buf);
  # 3.0: writes cal_thr[0..17] to the radar (shared by auto_calibrate, hist_apply, hist_undo)
  # 3.2: one command per gate. The ld2410 gate command always carries both move and still values (set_gate_threshold reads
  # both numbers), so the move number is only published and the still number's set sends both: 9 commands instead of 18.
  # Verified in ld2410.cpp: set_gate_threshold enters/leaves config mode only, it does not restart the radar.
  - id: write_thr
    mode: single
    then:
      - lambda: 'id(g0_move_threshold)->publish_state(id(cal_thr)[0]);'
      - number.set:
          id: g0_still_threshold
          value: !lambda 'return id(cal_thr)[1];'
      - delay: 300ms
      - lambda: 'id(g1_move_threshold)->publish_state(id(cal_thr)[2]);'
      - number.set:
          id: g1_still_threshold
          value: !lambda 'return id(cal_thr)[3];'
      - delay: 300ms
      - lambda: 'id(g2_move_threshold)->publish_state(id(cal_thr)[4]);'
      - number.set:
          id: g2_still_threshold
          value: !lambda 'return id(cal_thr)[5];'
      - delay: 300ms
      - lambda: 'id(g3_move_threshold)->publish_state(id(cal_thr)[6]);'
      - number.set:
          id: g3_still_threshold
          value: !lambda 'return id(cal_thr)[7];'
      - delay: 300ms
      - lambda: 'id(g4_move_threshold)->publish_state(id(cal_thr)[8]);'
      - number.set:
          id: g4_still_threshold
          value: !lambda 'return id(cal_thr)[9];'
      - delay: 300ms
      - lambda: 'id(g5_move_threshold)->publish_state(id(cal_thr)[10]);'
      - number.set:
          id: g5_still_threshold
          value: !lambda 'return id(cal_thr)[11];'
      - delay: 300ms
      - lambda: 'id(g6_move_threshold)->publish_state(id(cal_thr)[12]);'
      - number.set:
          id: g6_still_threshold
          value: !lambda 'return id(cal_thr)[13];'
      - delay: 300ms
      - lambda: 'id(g7_move_threshold)->publish_state(id(cal_thr)[14]);'
      - number.set:
          id: g7_still_threshold
          value: !lambda 'return id(cal_thr)[15];'
      - delay: 300ms
      - lambda: 'id(g8_move_threshold)->publish_state(id(cal_thr)[16]);'
      - number.set:
          id: g8_still_threshold
          value: !lambda 'return id(cal_thr)[17];'
      - delay: 300ms
  - id: hist_compute
    mode: single
    then:
      - lambda: |-
          auto tot = [](const uint16_t *h) -> uint32_t { uint32_t t = 0; for (int i = 0; i < 101; i++) t += h[i]; return t; };
          auto pct = [](const uint16_t *h, uint32_t t, float q) -> int {
            uint32_t need = (uint32_t) ceilf(q * t), c = 0;
            for (int i = 0; i < 101; i++) { c += h[i]; if (c >= need) return i; }
            return 100;
          };
          number::Number *th[18] = {${gates_thr_all_18}};
          float m = id(cal_margin).state;
          uint32_t minq = UINT32_MAX, occ = 0;
          int changes = 0;
          std::string sug;
          char b[8];
          for (int k = 0; k < 18; k++) {
            const uint16_t *q = &id(hq)[k * 101], *o = &id(ho)[k * 101];
            uint32_t nq = tot(q), no = tot(o);
            minq = std::min(minq, nq);
            occ += no;
            float cur = th[k]->state, t = cur;
            if (nq >= (uint32_t) id(hist_min_q).state) {
              int n = pct(q, nq, id(hist_pct_empty).state / 100.0f);
              t = std::min(100.0f, n + m);
              if ((k & 1) && no >= (uint32_t) id(hist_min_occ).state) {
                int p = pct(o, no, id(hist_pct_occ).state / 100.0f);
                if (p >= n + id(seat_gap).state && t >= p) t = std::max((float) n + 1, std::min(ceilf((n + p) / 2.0f), (float) p - 1));
              }
            }
            id(hist_thr)[k] = t;
            if (!std::isnan(cur) && !std::isnan(t) && fabsf(t - cur) >= 2) changes++;
            snprintf(b, sizeof(b), "%s%d", k ? "," : "", std::isnan(t) ? -1 : (int) t);
            sug += b;
          }
          if (id(thr_bak_ok) && !id(hist_bak_text).has_state()) {
            std::string bk;
            for (int k = 0; k < 18; k++) { snprintf(b, sizeof(b), "%s%d", k ? "," : "", (int) id(thr_bak)[k]); bk += b; }
            id(hist_bak_text).publish_state(bk);
          }
          id(hist_ready) = minq >= (uint32_t) id(hist_min_q).state;
          id(hist_changes) = id(hist_ready) ? changes : 0;
          id(hist_q_hours).publish_state(minq / 3600.0f);
          id(hist_o_n).publish_state(occ);
          id(hist_changes_s).publish_state(id(hist_changes));
          {
            // 干擾格：第 2～8 格的空房中位數，和「這 7 格中位數的中位數」比
            std::string ig;
            if (id(hist_ready)) {
              for (int t = 0; t < 2; t++) {  // t=0 移動、t=1 靜止
                // 3.8：只比偵測格數內的格（移動用 Radar Max Move Gate、靜止用 Radar Max Still Gate）；超出的格不判、也不拉高比較基準
                float mgx = t ? id(radar_max_still).state : id(radar_max_move).state;
                int gmax = std::isnan(mgx) ? 8 : std::max(2, std::min(8, (int) mgx));
                int ng = gmax - 1;  // 第 2..gmax 格共 ng 格
                if (ng < 3) continue;
                float med[7];
                for (int g = 2; g <= gmax; g++) { const uint16_t *q = &id(hq)[(2 * g + t) * 101]; med[g - 2] = pct(q, tot(q), 0.5f); }
                float srt[7]; memcpy(srt, med, sizeof(float) * ng); std::sort(srt, srt + ng);
                float mom = srt[ng / 2];
                for (int g = 2; g <= gmax; g++)
                  if (med[g - 2] >= id(intf_ratio).state * mom && med[g - 2] >= mom + id(intf_gap).state) {
                    char b2[24]; snprintf(b2, sizeof(b2), "%sG%d %s", ig.empty() ? "" : ", ", g, t ? "still" : "move"); ig += b2;
                  }
              }
              if (ig.empty()) ig = "none";
            } else ig = "collecting";
            if (!id(intf_gates_ts).has_state() || id(intf_gates_ts).state != ig) id(intf_gates_ts).publish_state(ig);
          }
          id(hist_sug_text).publish_state(id(hist_ready) ? sug : std::string(""));
          // keep the last action ("Applied", "Applied automatically", "Undone") visible; everything else is a transient state
          const std::string &st = id(hist_status).state;
          if (!id(hist_status).has_state() || (st.rfind("Applied", 0) != 0 && st != "Undone" && st != "Applying" && st != "Undoing"))
            id(hist_status).publish_state(id(hist_ready) ? "Ready" : "Collecting");
  - id: hist_apply
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              number::Number *th[18] = {${gates_thr_all_18}};
              for (int k = 0; k < 18; k++) if (std::isnan(th[k]->state) || std::isnan(id(hist_thr)[k])) return true;
              return !id(hist_ready) || id(cal_running) || id(write_thr).is_running();
          then:
            - lambda: 'id(hist_status).publish_state(id(hist_ready) ? "Busy, try later" : "Not enough data");'
            - delay: 10s
            - script.execute: hist_compute
            - script.stop: hist_apply
      - lambda: |-
          number::Number *th[18] = {${gates_thr_all_18}};
          std::string bk;
          char b[8];
          for (int k = 0; k < 18; k++) {
            float cur = th[k]->state, t = id(hist_thr)[k];
            if (id(hist_clamp)) t = std::max(cur - id(hist_clamp_step).state, std::min(cur + id(hist_clamp_step).state, t));
            id(thr_bak)[k] = cur;
            id(cal_thr)[k] = t;
            snprintf(b, sizeof(b), "%s%d", k ? "," : "", (int) cur);
            bk += b;
          }
          id(thr_bak_ok) = true;
          id(hist_bak_text).publish_state(bk);
          id(cal_running) = true;
          id(hist_status).publish_state("Applying");
          ESP_LOGI("hist", "apply (%s): %d thresholds differ by >= 2", id(hist_clamp) ? "auto" : "manual", id(hist_changes));
      - script.execute: write_thr
      - script.wait: write_thr
      - lambda: |-
          id(cal_running) = false;
          auto t = id(sntp_time).now();
          if (t.is_valid()) id(hist_last_apply) = (uint32_t) t.timestamp;
          id(hist_status).publish_state(id(hist_clamp) ? "Applied automatically" : "Applied");
      - delay: 2s
      - script.execute: hist_compute
  # 3.8 還原校準：把 Calibration Backup 的 18 個門檻寫回；備份保留，可重複還原
  - id: cal_restore
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(cal_bak_ok) || id(cal_running) || id(write_thr).is_running();'
          then:
            - script.stop: cal_restore
      - lambda: |-
          for (int k = 0; k < 18; k++) id(cal_thr)[k] = id(cal_bak)[k];
          id(cal_running) = true;
          id(cal_status).publish_state("Restoring thresholds");
      - script.execute: write_thr
      - script.wait: write_thr
      - lambda: |-
          id(cal_running) = false;
          id(cal_status).publish_state("Restored");
  - id: hist_undo
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(thr_bak_ok) || id(cal_running) || id(write_thr).is_running();'
          then:
            - lambda: 'id(hist_status).publish_state(id(thr_bak_ok) ? "Busy, try later" : "No backup");'
            - delay: 10s
            - script.execute: hist_compute
            - script.stop: hist_undo
      - lambda: |-
          for (int k = 0; k < 18; k++) id(cal_thr)[k] = id(thr_bak)[k];
          id(cal_running) = true;
          id(hist_status).publish_state("Undoing");
      - script.execute: write_thr
      - script.wait: write_thr
      - lambda: |-
          id(cal_running) = false;
          id(thr_bak_ok) = false;
          id(hist_bak_text).publish_state("");
          id(hist_status).publish_state("Undone");
      - delay: 2s
      - script.execute: hist_compute
  - id: auto_calibrate
    mode: single
    then:
      # 4.3.1：雷達參數（最大格數）還沒讀回就不能校準：備份會存成全 0、品質判定也不準。先自動重讀一次，仍沒讀回才中止
      - if:
          condition:
            lambda: 'return !(id(radar_max_move).state >= 2 && id(radar_max_still).state >= 2);'
          then:
            - button.press: radar_query_btn
            - delay: 6s
            - if:
                condition:
                  lambda: 'return !(id(radar_max_move).state >= 2 && id(radar_max_still).state >= 2);'
                then:
                  - lambda: 'id(cal_status).publish_state("Failed: radar parameters not read, press Radar Query Params and retry");'
                  - script.stop: auto_calibrate
      - lambda: 'id(cal_running) = true;'
      - if:
          condition:
            switch.is_on: led_status
          then:
            - light.turn_on:
                id: ws2812
                brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                red: 0%
                green: 0%
                blue: 100%
                effect: "Breath"
      - lambda: |-
          id(cal_status).publish_state("Leave the room, starting soon");
          for (int i = 0; i < 18; i++) { id(cal_max)[i] = 0; id(cal_sum)[i] = 0; }
          id(cal_samples) = 0;
      - delay: !lambda 'return (uint32_t) (id(cal_delay).state * 1000);'
      - switch.turn_on: ld2410_engineering
      - lambda: |-
          id(cal_status).publish_state("Sampling, keep the room empty");
          id(cal_end_ms) = millis() + (uint32_t) (id(cal_duration).state * 1000);
          id(cal_sample_ms) = millis(); id(cal_abort_n) = 0; id(cal_aborted) = false;
      - delay: 3s
      - while:
          condition:
            lambda: 'return (int32_t) (id(cal_end_ms) - millis()) > 0;'
          then:
            - lambda: |-
                sensor::Sensor *e[18] = {${gates_energy_all_18}};
                bool got = false;
                for (int i = 0; i < 18; i++) {
                  float v = e[i]->state;
                  if (std::isnan(v)) continue;
                  got = true;
                  if (v > id(cal_max)[i]) id(cal_max)[i] = v;
                  id(cal_sum)[i] += v;
                }
                if (got) id(cal_samples)++;
                // 3.2：取樣開始 5 秒後（PIR 有 5 秒延遲關），PIR 觸發或任一格移動能量 ≥90 連續 1 秒 → 房間有人，中止
                if (millis() - id(cal_sample_ms) > (uint32_t) (id(cal_abort_wait_s).state * 1000.0f)) {
                  float mx = 0;
                  for (int i = 0; i < 18; i += 2) if (!std::isnan(e[i]->state)) mx = std::max(mx, e[i]->state);
                  id(cal_abort_n) = mx >= id(cal_abort_energy).state ? id(cal_abort_n) + 1 : 0;
                  if (id(motion).state || id(cal_abort_n) >= (int) (id(cal_abort_s).state * 5)) {
                    ESP_LOGW("cal", "empty-room sampling aborted: PIR %d, max move energy %.0f", id(motion).state ? 1 : 0, mx);
                    id(cal_aborted) = true;
                    id(cal_end_ms) = millis();
                  }
                }
            - delay: 200ms
      - if:
          condition:
            lambda: 'return id(cal_aborted);'
          then:
            - switch.turn_off: ld2410_engineering
            - lambda: |-
                id(cal_status).publish_state("Aborted: someone in the room, thresholds unchanged");
                id(cal_running) = false;
            - if:
                condition:
                  switch.is_on: led_status
                then:
                  - light.turn_off: ws2812
                  - script.execute: led_sync
            - if:
                condition:
                  switch.is_on: sounds
                then:
                  - rtttl.play: "abort:d=8,o=5,b=140:e,p,c"
            - script.stop: auto_calibrate
      - if:
          condition:
            lambda: 'return id(cal_samples) == 0;'
          then:
            - switch.turn_off: ld2410_engineering
            - lambda: |-
                id(cal_status).publish_state("Failed: no energy data, thresholds unchanged");
                id(cal_running) = false;
            - if:
                condition:
                  switch.is_on: led_status
                then:
                  - light.turn_off: ws2812
                  - script.execute: led_sync
            - script.stop: auto_calibrate
      - lambda: |-
          // 底噪統計（網頁「校準與備份」用）：18 個值，順序＝第0格移動、第0格靜止、第1格移動…
          std::string mx, av;
          char t[16];
          for (int i = 0; i < 18; i++) {
            snprintf(t, sizeof(t), "%s%d", i ? "," : "", (int) id(cal_max)[i]);
            mx += t;
            snprintf(t, sizeof(t), "%s%.1f", i ? "," : "", id(cal_sum)[i] / id(cal_samples));
            av += t;
          }
          id(noise_max_text).publish_state(mx);
          id(noise_avg_text).publish_state(av);
          {
            int bad = 0; float worst = 0;
            // 3.8：只算偵測格數內的格（移動用 Radar Max Move Gate、靜止用 Radar Max Still Gate），超出的格不影響品質判定
            float mg = id(radar_max_move).state, sg = id(radar_max_still).state;
            // 4.3.1：最大格數是 0（還沒讀回）時，下面的迴圈會把每一格都跳過、bad 永遠是 0 而誤報 stable → 改報「參數未讀回」
            bool unread = (!std::isnan(mg) && mg < 1) || (!std::isnan(sg) && sg < 1);
            int mgi = std::isnan(mg) ? 8 : (int) mg, sgi = std::isnan(sg) ? 8 : (int) sg;
            // 4.3.1：底噪飽和：偵測格內平均能量 ≥ 90 的格數；門檻會被卡在上限 100，雷達等於失明或永遠判有人
            int sat = 0;
            if (!unread && id(cal_samples) > 0)
              for (int i = 4; i < 18; i++) {
                if ((i >> 1) > ((i & 1) ? sgi : mgi)) continue;
                float sp = id(cal_max)[i] - id(cal_sum)[i] / id(cal_samples);
                worst = std::max(worst, sp);
                if (sp >= id(cal_spread_limit).state) bad++;
                if (id(cal_sum)[i] / id(cal_samples) >= 90.0f) sat++;
              }
            char q[112];
            if (unread) snprintf(q, sizeof(q), "unknown: radar parameters not read, press Radar Query Params and calibrate again");
            else if (sat >= 2) snprintf(q, sizeof(q), "saturated: %d gates average >= 90, check power, position or the radar module", sat);
            else if (bad == 0) snprintf(q, sizeof(q), "stable (max spread %.0f)", worst);
            else snprintf(q, sizeof(q), "unstable: %d values vary by >= %.0f (max spread %.0f), try again with AC/fans off", bad, id(cal_spread_limit).state, worst);
            id(cal_quality_ts).publish_state(q);
            id(cal_unstable) = bad > 0 || unread || sat >= 2;
            id(cal_hard_unstable) = worst >= id(cal_abort_spread).state;
          }
      # 3.8 兩段式：最大波動 ≥ Calibration Abort Spread（且「Calibration Block Unstable」開著）→ 不寫入門檻、中止；
      # 只超過 Calibration Spread Limit → 照寫，狀態與階段標警告（done_warning）
      - if:
          condition:
            lambda: 'return id(cal_hard_unstable) && id(cal_block_unstable).state;'
          then:
            - switch.turn_off: ld2410_engineering
            - lambda: |-
                id(cal_status).publish_state("Aborted: unstable sampling, thresholds unchanged");
                id(cal_running) = false;
            - if:
                condition:
                  switch.is_on: led_status
                then:
                  - light.turn_off: ws2812
                  - script.execute: led_sync
            - if:
                condition:
                  switch.is_on: sounds
                then:
                  - rtttl.play: "abort:d=8,o=5,b=140:e,p,c"
            - script.stop: auto_calibrate
      # 2.9 雙點校準第二點：請回到平常待的位置坐著不動；前 10 秒不取樣（走回座位），之後取 Sit Duration 秒的各格靜止能量平均
      - lambda: |-
          id(cal_sit_n) = 0; id(cal_skip_sit) = false;
          for (int g = 0; g < 9; g++) id(cal_sit_sum)[g] = 0;
      - if:
          condition:
            switch.is_on: cal_two
          then:
            - lambda: |-
                id(cal_status).publish_state("Sit still at your usual spot");
                id(cal_sit_ok) = 0;
                id(cal_end_ms) = millis() + (uint32_t) (id(cal_sit_wait_s).state * 1000.0f);
            - if:
                condition:
                  switch.is_on: sounds
                then:
                  - rtttl.play: "sit:d=8,o=5,b=160:g,p,g,p,g"
            # 3.1：等人真的坐回近處（有人＋靜止目標在近處範圍內，連續 3 秒）才開始取樣，最多等 90 秒
            - while:
                condition:
                  lambda: 'return id(cal_sit_ok) < (int) (id(cal_sit_confirm_s).state * 5) && (int32_t) (id(cal_end_ms) - millis()) > 0;'
                then:
                  - lambda: |-
                      float res = ${radar_res_m};
                      float sd = id(radar_still_dist).state;
                      bool near = id(presence_raw).state && id(radar_still).state && !std::isnan(sd) && (int) (sd / res) <= (int) id(delay_near).state;
                      id(cal_sit_ok) = near ? id(cal_sit_ok) + 1 : 0;
                  - delay: 200ms
            - if:
                condition:
                  lambda: 'return id(cal_sit_ok) >= (int) (id(cal_sit_confirm_s).state * 5);'
                then:
                  - lambda: |-
                      id(cal_status).publish_state("Seated, sampling");
                      id(cal_end_ms) = millis() + (uint32_t) (id(cal_sit_duration).state * 1000);
                else:
                  - lambda: |-
                      id(cal_skip_sit) = true;
                      id(cal_end_ms) = millis();
            - while:
                condition:
                  lambda: 'return (int32_t) (id(cal_end_ms) - millis()) > 0;'
                then:
                  - lambda: |-
                      sensor::Sensor *s[9] = {${gates_energy_still_9}};
                      bool ok = true;
                      for (int g = 0; g < 9; g++) if (std::isnan(s[g]->state)) ok = false;
                      if (ok) {
                        for (int g = 0; g < 9; g++) id(cal_sit_sum)[g] += s[g]->state;
                        id(cal_sit_n)++;
                      }
                  - delay: 200ms
      # 門檻＝底噪最大值＋餘裕（上限 100）。雙點：某格坐著的平均靜止能量 p 比底噪最大值 n 高至少 2，但門檻 ≥ p（會漏掉人），
      # 就把該格靜止門檻改成 n 與 p 的中點（至少 n+1、至多 p-1）。移動門檻不受第二點影響。
      - lambda: |-
          float m = id(cal_margin).state;
          int adj = 0, sig = 0;
          // 3.1：歷史學習資料足夠（每格空房 ≥20000 筆）時，底噪改用歷史分布的 99.9 百分位；不足就用這次取樣的最大值
          float nf[18];
          id(cal_used_hist) = id(hist_ready);
          for (int k = 0; k < 18; k++) {
            nf[k] = id(cal_max)[k];
            if (!id(hist_ready)) continue;
            const uint16_t *q = &id(hq)[k * 101];
            uint32_t t = 0, c = 0; for (int i = 0; i < 101; i++) t += q[i];
            uint32_t need = (uint32_t) ceilf((id(hist_pct_empty).state / 100.0f) * t); int n = 100;
            for (int i = 0; i < 101; i++) { c += q[i]; if (c >= need) { n = i; break; } }
            nf[k] = n;
          }
          for (int g = 0; g < 9; g++) {
            id(cal_thr)[2 * g] = std::min(100.0f, nf[2 * g] + m);
            float st = std::min(100.0f, nf[2 * g + 1] + m);
            if (id(cal_sit_n) > 0) {
              float n = nf[2 * g + 1], p = id(cal_sit_sum)[g] / id(cal_sit_n);
              if (p >= n + id(seat_gap).state) sig++;
              if (p >= n + id(seat_gap).state && st >= p) {
                float t = std::max(n + 1, std::min(ceilf((n + p) / 2), p - 1));
                ESP_LOGI("cal", "two-point gate %d still: noise max %.0f, seated avg %.1f, threshold %.0f -> %.0f", g, n, p, st, t);
                st = t; adj++;
              }
            }
            id(cal_thr)[2 * g + 1] = st;
          }
          if (id(cal_two).state) ESP_LOGI("cal", "two-point: %d seated samples, %d gates see the person, %d still thresholds lowered", id(cal_sit_n), sig, adj);
          id(cal_seat_sig) = sig; id(cal_lowered) = adj; id(cal_verify) = -1;
          // 3.8：寫入前備份目前 18 個門檻到 Calibration Backup（和歷史套用的備份分開；Restore Calibration 還原）；門檻還沒讀回（NaN）就不備份
          {
            number::Number *th[18] = {${gates_thr_all_18}};
            bool all = true, any_nonzero = false;
            for (int k = 0; k < 18; k++) { if (std::isnan(th[k]->state)) all = false; else if (th[k]->state > 0) any_nonzero = true; }
            // 4.3.1：18 個門檻全是 0 代表還沒讀回（開機後可能停在 0），不備份，否則 Restore Calibration 會把全 0 寫回雷達
            if (all && any_nonzero) {
              std::string bk; char b[8];
              for (int k = 0; k < 18; k++) { id(cal_bak)[k] = th[k]->state; snprintf(b, sizeof(b), "%s%d", k ? "," : "", (int) th[k]->state); bk += b; }
              id(cal_bak_ok) = true;
              id(cal_backup_text).publish_state(bk);
              auto tb = id(sntp_time).now();
              if (tb.is_valid()) { id(cal_bak_at) = (uint32_t) tb.timestamp; id(cal_backup_at_ts).publish_state(ESPTime::from_epoch_utc(tb.timestamp).strftime("%Y-%m-%dT%H:%M:%SZ")); }
            }
          }
          id(cal_status).publish_state("Writing thresholds");
      - script.execute: write_thr
      - script.wait: write_thr
      - switch.turn_off: ld2410_engineering
      # 3.2 第二點驗證：寫完新門檻 3 秒後，人還坐著時雷達是否仍判定有人
      - if:
          condition:
            lambda: 'return id(cal_sit_n) > 0;'
          then:
            - lambda: 'id(cal_status).publish_state("Verifying");'
            - delay: !lambda 'return (uint32_t) (id(cal_verify_s).state * 1000.0f);'
            - lambda: 'id(cal_verify) = id(presence_raw).state ? 1 : 0;'
      - lambda: 'id(cal_running) = false;'
      - if:
          condition:
            switch.is_on: led_status
          then:
            - light.turn_off: ws2812
            - script.execute: led_sync
      - lambda: |-
          char buf[192], seat[48] = "";
          if (id(cal_sit_n) > 0)
            snprintf(seat, sizeof(seat), ", seated %d gates, lowered %d, %s", id(cal_seat_sig), id(cal_lowered), id(cal_verify) == 1 ? "seen" : "not seen");
          snprintf(buf, sizeof(buf), "Done, %d samples%s%s%s%s", (int) id(cal_samples), id(cal_used_hist) ? ", history used" : "", id(cal_skip_sit) ? ", seated step skipped" : "", seat, id(cal_unstable) ? ", warning: unstable sampling" : "");
          id(cal_status).publish_state(buf);
      - if:
          condition:
            switch.is_on: sounds
          then:
            - rtttl.play: "done:d=16,o=6,b=200:c,e,g"

light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    channel_colors: GRB
    pin: GPIO8
    num_leds: 6
    name: "LED All"
    id: ws2812
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: "Breath"
          update_interval: 15ms
          lambda: |-
            static float phase = 0.0f;
            if (initial_run) {
              phase = 0.0f;
            }
            float level = (sin(phase) + 1.0f) / 2.0f;
            uint8_t scale = 20 + level * 235;
            for (int i = 0; i < it.size(); i++) {
              it[i] = current_color * scale;
            }
            phase += 0.05f;
            if (phase >= 2.0f * M_PI) {
              phase -= 2.0f * M_PI;
            }
      - addressable_lambda:
          name: "Alert Blink"
          update_interval: 500ms
          lambda: |-
            static bool on = false;
            on = !on;
            for (int i = 0; i < it.size(); i++) {
              it[i] = on ? current_color : Color::BLACK;
            }
  - platform: partition
    id: ws2812_left
    name: "LED Left"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 0
        to: 2
    effects:
      - addressable_lambda:
          name: "Left Flow"
          update_interval: 500ms
          lambda: |-
            static uint8_t pos = 0;
            if (initial_run) {
              pos = 0;
              it.all() = Color::BLACK;
              return;
            }
            it.all().fade_to_black(100);
            it[pos] = Color(255, 0, 0);
            pos = (pos + 1) % 3;
  - platform: partition
    id: ws2812_right
    name: "LED Right"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 3
        to: 5
        reversed: true
    effects:
      - addressable_lambda:
          name: "Right Flow"
          update_interval: 500ms
          lambda: |-
            static uint8_t pos = 0;
            if (initial_run) {
              pos = 0;
              it.all() = Color::BLACK;
              return;
            }
            it.all().fade_to_black(100);
            it[pos] = Color(0, 255, 0);
            pos = (pos + 1) % 3;
  - platform: partition
    id: ws2812_1
    name: "LED 1"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 0
        to: 0
    # 每顆都能選效果，LED 2～6 共用同一份
    effects: &single_led_effects
      - addressable_lambda:
          name: "Breath"
          update_interval: 15ms
          lambda: |-
            static float phase = 0.0f;
            if (initial_run) {
              phase = 0.0f;
            }
            float level = (sin(phase) + 1.0f) / 2.0f;
            uint8_t scale = 20 + level * 235;
            for (int i = 0; i < it.size(); i++) {
              it[i] = current_color * scale;
            }
            phase += 0.05f;
            if (phase >= 2.0f * M_PI) {
              phase -= 2.0f * M_PI;
            }
      - addressable_lambda:
          name: "Alert Blink"
          update_interval: 500ms
          lambda: |-
            static bool on = false;
            on = !on;
            for (int i = 0; i < it.size(); i++) {
              it[i] = on ? current_color : Color::BLACK;
            }
  - platform: partition
    id: ws2812_2
    name: "LED 2"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 1
        to: 1
    effects: *single_led_effects
  - platform: partition
    id: ws2812_3
    name: "LED 3"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 2
        to: 2
    effects: *single_led_effects
  - platform: partition
    id: ws2812_4
    name: "LED 4"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 3
        to: 3
    effects: *single_led_effects
  - platform: partition
    id: ws2812_5
    name: "LED 5"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 4
        to: 4
    effects: *single_led_effects
  - platform: partition
    id: ws2812_6
    name: "LED 6"
    restore_mode: ALWAYS_OFF
    segments:
      - id: ws2812
        from: 5
        to: 5
    effects: *single_led_effects
