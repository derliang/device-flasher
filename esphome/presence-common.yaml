# HLK LD2410B 人體感應器（ESP32-C3）自管韌體：共用主體。
# 本檔由 presence-product.yaml（產品版，名稱加 MAC 尾碼）或 presence-device.example.yaml（單台設定範例）以 packages 引入；
# 各台的主檔只放 substitutions（devicename、upper_devicename、device_label）。
#
# 主要功能：
#   - 雷達全部可調項做成實體：各格能量、各格門檻、無人逾時、最遠距離格、解析度、光感功能、工程模式。
#   - 底噪校準在裝置端做：空房取樣各格能量，最大值加餘裕寫回門檻；另有原廠校準（按鈕 Radar Factory Calibrate）與雙點校準
#     （空房取樣後坐回平常位置取第二點）。
#   - 歷史學習（History Learning）：工程模式開著時把各格能量記成分布，定期算建議門檻，可套用、復原、重設，也可設定自動套用。
#   - 智慧延時（Smart Delay）與有人狀態機（Empty／Entering／Moving／Still／Leaving）：每個狀態用不同逾時；
#     離開殘留過濾、進入遲滯；Presence Reason 說明目前為什麼判定有人。
#   - 雷達斷線偵測與自動恢復（Radar Link）、雷達參數讀回防呆（開機與斷線恢復後自動重讀）。
#   - 區域輸出（Zone 1／2 起訖格）、離開區、空房底噪漂移監看。
#   - 蜂鳴器、整點報時、燈珠預設全關，網頁與 Home Assistant 都能開。
#   - 溫濕度補償做成可調數字（預設 0）。
#   - 日誌走 USB-Serial/JTAG（GPIO20/21 同時是預設日誌腳與雷達腳）。
#   - 內建繁體中文網頁介面（presence-web.js，編譯時包進韌體；網址加 ?native 回到 ESPHome 原始介面），含七步調校精靈。
#   - 不含任何 Wi-Fi 帳密、API 加密金鑰或 OTA 密碼：Wi-Fi 在裝置上設定（improv／熱點配網）；API 先接受明文，
#     Home Assistant 連上後可自行產生金鑰（要清掉只能恢復出廠）。
#   - 雷達自帶藍牙開關（指令 00A4）只放進階：網頁收在「進階（小心）」並二次確認；關掉後只能斷電再上電 5 次以上才能重開。
#
# 自訂 ld2410 元件在 components/ld2410（修改自 ESPHome 2026.10.1，見 NOTICE.md）。

substitutions:
  firmware_version: "4.3.2"
  # 3.3：網頁版本（必須等於 presence-web.js 的 WEB_VERSION）
  web_version: "4.25"
  # 3.7 去重：九格／十八格的實體清單與距離解析度，原本在 lambda 裡複製貼上 11＋5 處；改成文字取代，產生的 C++ 完全相同
  # （ESPHome 會在編譯前把 ${名稱} 換成這裡的文字，lambda 裡也有效）
  gates_energy_still_9_state: "id(g0_still_energy).state, id(g1_still_energy).state, id(g2_still_energy).state, id(g3_still_energy).state, id(g4_still_energy).state, id(g5_still_energy).state, id(g6_still_energy).state, id(g7_still_energy).state, id(g8_still_energy).state"
  gates_energy_all_18: "id(g0_move_energy), id(g0_still_energy), id(g1_move_energy), id(g1_still_energy), id(g2_move_energy), id(g2_still_energy), id(g3_move_energy), id(g3_still_energy), id(g4_move_energy), id(g4_still_energy), id(g5_move_energy), id(g5_still_energy), id(g6_move_energy), id(g6_still_energy), id(g7_move_energy), id(g7_still_energy), id(g8_move_energy), id(g8_still_energy)"
  gates_thr_move_9: "id(g0_move_threshold), id(g1_move_threshold), id(g2_move_threshold), id(g3_move_threshold), id(g4_move_threshold), id(g5_move_threshold), id(g6_move_threshold), id(g7_move_threshold), id(g8_move_threshold)"
  gates_thr_still_9: "id(g0_still_threshold), id(g1_still_threshold), id(g2_still_threshold), id(g3_still_threshold), id(g4_still_threshold), id(g5_still_threshold), id(g6_still_threshold), id(g7_still_threshold), id(g8_still_threshold)"
  gates_thr_all_18: "id(g0_move_threshold), id(g0_still_threshold), id(g1_move_threshold), id(g1_still_threshold), id(g2_move_threshold), id(g2_still_threshold), id(g3_move_threshold), id(g3_still_threshold), id(g4_move_threshold), id(g4_still_threshold), id(g5_move_threshold), id(g5_still_threshold), id(g6_move_threshold), id(g6_still_threshold), id(g7_move_threshold), id(g7_still_threshold), id(g8_move_threshold), id(g8_still_threshold)"
  gates_energy_still_9: "id(g0_still_energy), id(g1_still_energy), id(g2_still_energy), id(g3_still_energy), id(g4_still_energy), id(g5_still_energy), id(g6_still_energy), id(g7_still_energy), id(g8_still_energy)"
  radar_res_m: '(strcmp(id(radar_res).current_option().c_str(), "0.2m") == 0) ? 20.0f : 75.0f'
  # 時區（整點報時與智慧延時的時間判斷用）；預設台北時區，請在各台設定檔以 substitutions 覆寫成自己的時區，例如 Europe/Berlin
  timezone: "Asia/Taipei"
  # 產品版設 "true"：名稱加 MAC 尾碼，多台不撞名
  mac_suffix: "false"
  # 3.4：溫濕度補償預設 0（通用版）；需要時由各台設定檔以 substitutions 覆寫
  temp_offset_default: "0"
  humi_offset_default: "0"
  comment: HLK LD2410B presence sensor

esphome:
  name: $devicename
  friendly_name: $upper_devicename
  name_add_mac_suffix: ${mac_suffix}
  comment: $comment
  # 3.0: history histograms live in RAM; the flash copies are restored here
  on_boot:
    priority: -100
    then:
      - lambda: |-
          memcpy(id(hq), id(hq_save), sizeof(id(hq)));
          memcpy(id(ho), id(ho_save), sizeof(id(ho)));
      # 3.3：機器讀的固定值與初始狀態（HA 磚、網頁用）
      - lambda: |-
          id(web_version_ts).publish_state("${web_version}");
          id(capabilities_ts).publish_state("{\"gates\":9,\"max_gate_min\":2,\"max_gate_max\":8,\"resolutions\":[\"0.75m\",\"0.2m\"],\"still_threshold_fixed_gates\":[0,1]}");
          id(cal_phase_ts).publish_state("idle");
          id(eng_owner_ts).publish_state("off");
          id(smart_mode_ts).publish_state(id(smart_delay).state ? "normal" : "off");
          id(restore_status_ts).publish_state("idle");
      # 3.4 穩健性：開機時檢查可調數字（含快閃還原的值）。空值或超出範圍就回預設，並記在 Config Check。
      # 預設值要和各實體的 initial_value 與 restore_settings 一致
      - lambda: |-
          int bad = 0;
          for (auto &d : std::vector<std::pair<number::Number *, float>>{
              {id(floor_wait_s), 60}, {id(floor_window), 180}, {id(floor_every_min), 30}, {id(occ_every_min), 60}, {id(pir_recent_s), 300},
              {id(hist_start_s), 180}, {id(hist_quiet_s), 600}, {id(hist_apply_days), 7}, {id(hist_clamp_step), 10}, {id(hist_min_q), 20000},
              {id(hist_min_occ), 300}, {id(hist_pct_empty), 99.9f}, {id(hist_pct_occ), 10}, {id(seat_gap), 2}, {id(cal_abort_wait_s), 5},
              {id(cal_abort_energy), 90}, {id(cal_abort_s), 1}, {id(cal_sit_wait_s), 90}, {id(cal_sit_confirm_s), 3}, {id(cal_verify_s), 3},
              {id(residue_window), 10}, {id(pir_hold_s), 5}, {id(smart_write_gap_s), 30}, {id(settle_s), 12}, {id(pir_mismatch_s), 3},
              {id(cal_spread_limit), 20}, {id(intf_ratio), 2.5f}, {id(intf_gap), 10},
              {id(residue_drop), 0}, {id(residue_max_e), 35}, {id(residue_rebound), 5}, {id(residue_confirm_s), 4}, {id(residue_max_s), 60}, {id(entering_s), 10},
              {id(zone_hold_s), 4}, {id(state_smooth_s), 3}, {id(cal_abort_spread), 40}, {id(entry_confirm_s), 2}, {id(bridge_e), 60}, {id(bridge_s), 60}, {id(led_brightness), 30}, {id(lost_hold_s), 180}, {id(energy_pres), 30},
              {id(exit_near), 0}, {id(exit_far), 0}, {id(exit_win_s), 0}, {id(exit_e), 15}}) {
            float v = d.first->state, lo = d.first->traits.get_min_value(), hi = d.first->traits.get_max_value();
            if (std::isnan(v) || v < lo || v > hi) {
              ESP_LOGW("config", "%s = %.2f is invalid, reset to %.2f", d.first->get_name().c_str(), v, d.second);
              auto c = d.first->make_call(); c.set_value(d.second); c.perform(); bad++;
            }
          }
          char b[48];
          if (bad == 0) snprintf(b, sizeof(b), "ok");
          else snprintf(b, sizeof(b), "reset %d invalid value(s) to default", bad);
          id(config_check_ts).publish_state(b);
      # 4.3.1：開機後確認雷達參數（最大格數、門檻）有讀回，沒讀回就自動重讀（見 script ensure_params）
      - script.execute: ensure_params
      - delay: 60s
      - script.execute: hist_compute
  project:
    name: "community.PresencePlus"
    version: ${firmware_version}
  min_version: "2026.10.0"

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 30s

# GPIO20/21 是雷達 UART，日誌必須走 USB（原生 USB-Serial/JTAG）
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 0s
  # 不寫金鑰：先接受明文，HA 連上後可自己產生金鑰寫入。要清掉金鑰只能恢復出廠
  encryption: {}

ota:
  - platform: esphome
  - platform: web_server

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 10

# 不寫 SSID：帳密存在裝置裡。沒存過時開機就開熱點；有存過時斷線 5 分鐘才開，連回後自動關閉
wifi:
  min_auth_mode: WPA2
  ap:
    ap_timeout: 5min
  power_save_mode: NONE
  reboot_timeout: 1h
  on_connect:
    then:
      - if:
          condition:
            switch.is_on: sounds
          then:
            - rtttl.play: "wifi:d=16,o=6,b=200:e,p,e"
      - if:
          condition:
            lambda: 'return id(led_status).state && !id(cal_running);'
          then:
            - light.turn_off: ws2812
            - script.execute: led_sync

interval:
  # 2.8: radar link watchdog. No data frame for N seconds -> link down + auto recovery (presence is NOT invalidated: ESPHome would not re-publish it after recovery).
  - interval: 2s
    then:
      - lambda: |-
          bool ok = id(ld2410_hub)->get_frame_age_ms() < (uint32_t) (id(radar_link_timeout).state * 1000);
          if (!id(radar_link).has_state() || id(radar_link).state != ok) id(radar_link).publish_state(ok);
          if (!ok && id(link_was_ok)) {
            id(link_drops)++;
          }
          id(link_was_ok) = ok;
      - if:
          condition:
            lambda: 'return !id(link_was_ok) && !id(cal_running);'
          then:
            - script.execute: link_recover
  - interval: 10s
    then:
      - lambda: 'id(low_mem_bs).publish_state(esp_get_free_heap_size() < 80000);'
      - lambda: |-
          if (id(presence).state || !id(ld2410_engineering).state) { id(empty_since) = 0; return; }
          if (id(empty_since) == 0) { id(empty_since) = millis(); return; }
          if (millis() - id(empty_since) < (uint32_t) (id(floor_wait_s).state * 1000.0f)) return;
          float v[9] = {${gates_energy_still_9_state}};
          float sum = 0; int n = 0;
          for (float x : v) { if (!std::isnan(x)) { sum += x; n++; } }
          if (n == 0) return;
          float lvl = sum / n;
          float a = std::max(1.0f / std::max(1.0f, id(floor_window).state), 1.0f / (id(floor_n) + 1));
          if (id(floor_n) == 0) id(floor_level) = lvl; else id(floor_level) += a * (lvl - id(floor_level));
          id(floor_n)++;
          if (id(floor_ref) < 0 && id(floor_n) >= (int) id(floor_window).state) id(floor_ref) = id(floor_level);
  # 2.6: floor drift needs engineering mode, which auto-offs; open it for one sampling window every 30 min while the room is empty
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return !id(presence).state && !id(cal_running) && (millis() / 60000) % std::max((uint32_t) 1, (uint32_t) id(floor_every_min).state) == 5 && !id(ld2410_engineering).state;'
          then:
            - lambda: 'id(eng_owner_next) = 3;'
            - switch.turn_on: ld2410_engineering
  # 3.0: collect "person present" energies: open one engineering window per hour while a PIR-confirmed person is in
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              uint32_t now = millis();
              return id(hist_learn).state && id(presence).state && !id(cal_running) && !id(ld2410_engineering).state &&
                     id(hist_pir_ms) != 0 && now - id(hist_pir_ms) < (uint32_t) (id(pir_recent_s).state * 1000.0f) &&
                     (id(hist_occ_eng_ms) == 0 || now - id(hist_occ_eng_ms) >= (uint32_t) (id(occ_every_min).state * 60000.0f));
          then:
            - lambda: 'id(hist_occ_eng_ms) = millis(); id(eng_owner_next) = 4;'
            - switch.turn_on: ld2410_engineering
  # 3.0 history learning: one sample per second while engineering mode is on
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = millis();
          if (id(presence).state || id(motion).state) id(hist_busy_ms) = now;
          if (id(motion).state) id(hist_pir_ms) = now;
          if (!id(hist_learn).state || id(cal_running) || !id(ld2410_engineering).state || now < (uint32_t) (id(hist_start_s).state * 1000.0f)) return;
          sensor::Sensor *e[18] = {${gates_energy_all_18}};
          auto add = [](uint16_t *row, float v) {
            if (std::isnan(v)) return;
            int b = std::max(0, std::min(100, (int) lroundf(v)));
            if (row[b] >= 65000) for (int i = 0; i < 101; i++) row[i] >>= 1;
            row[b]++;
          };
          bool quiet = !id(presence).state && !id(motion).state && id(hist_busy_ms) != 0 && now - id(hist_busy_ms) >= (uint32_t) (id(hist_quiet_s).state * 1000.0f);
          if (quiet) {
            for (int k = 0; k < 18; k++) add(&id(hq)[k * 101], e[k]->state);
            return;
          }
          if (!id(presence).state || id(hist_pir_ms) == 0 || now - id(hist_pir_ms) > (uint32_t) (id(pir_recent_s).state * 1000.0f)) return;
          float res = ${radar_res_m};
          float sd = id(radar_still_dist).state, md = id(radar_move_dist).state;
          if (!std::isnan(sd) && sd > 0) { int g = (int) (sd / res); if (g <= 8) add(&id(ho)[(2 * g + 1) * 101], e[2 * g + 1]->state); }
          if (!std::isnan(md) && md > 0) { int g = (int) (md / res); if (g <= 8) add(&id(ho)[(2 * g) * 101], e[2 * g]->state); }
  - interval: 10min
    then:
      - script.execute: hist_compute
      - script.wait: hist_compute
      - if:
          condition:
            lambda: |-
              if (!id(hist_auto).state || !id(hist_ready) || id(hist_changes) == 0 || id(cal_running)) return false;
              if (id(presence).state || id(motion).state || millis() - id(hist_busy_ms) < (uint32_t) (id(hist_quiet_s).state * 1000.0f)) return false;
              auto t = id(sntp_time).now();
              if (!t.is_valid()) return false;
              return id(hist_last_apply) == 0 || (uint32_t) t.timestamp - id(hist_last_apply) >= (uint32_t) (id(hist_apply_days).state * 86400.0f);
          then:
            - lambda: 'id(hist_clamp) = true;'
            - script.execute: hist_apply
  - interval: 60min
    then:
      - lambda: |-
          memcpy(id(hq_save), id(hq), sizeof(id(hq)));
          memcpy(id(ho_save), id(ho), sizeof(id(ho)));
  # 2.9: 1 s so a walk to the door (2-3 s of far readings) is caught; the lambda is cheap
  - interval: 1s
    then:
      - script.execute: smart_delay_tick
      # 3.8：區輸出保持時間到了就放開（zone_eval 只在輸入變動時才跑）
      - lambda: |-
          uint32_t now = millis();
          uint32_t hold = (uint32_t) (std::max(0.0f, id(zone_hold_s).state) * 1000.0f);
          binary_sensor::BinarySensor *zo[2] = {id(zone1_occupied), id(zone2_occupied)};
          for (int i = 0; i < 2; i++)
            if (!id(zone_raw)[i] && zo[i]->state && now - id(zone_last)[i] >= hold) zo[i]->publish_state(false);
  # Wi-Fi 斷線時（狀態燈開啟才作用）整排紅色閃爍
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - switch.is_on: led_status
              - not:
                  wifi.connected:
          then:
            - light.turn_on:
                id: ws2812
                brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                red: 100%
                green: 0%
                blue: 0%
                effect: "Alert Blink"

captive_portal:

mdns:
  disabled: false

debug:
  update_interval: 60s

web_server:
  port: 80
  include_internal: true
  version: 3
  # 自製網頁，網址加 ?native 回原始介面
  js_url: ""
  js_include: presence-web.min.js

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - if:
              condition:
                switch.is_on: hourly_chime
              then:
                - rtttl.play: "chime2:d=16,o=6,b=140:c,p,c"
      - seconds: 0
        minutes: 30
        then:
          - if:
              condition:
                switch.is_on: hourly_chime
              then:
                - rtttl.play: "chime1:d=16,o=6,b=140:c"

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

i2c:
  sda: GPIO2
  scl: GPIO1
  scan: true
  frequency: 50kHz

# 本地覆寫 ld2410 元件（components/ld2410，修改自 ESPHome 2026.10.1，只加原廠校準 000B／001B 與目標狀態 4／5／6 分離；升級 ESPHome 時要重新比對，見 NOTICE.md）
external_components:
  - source:
      type: local
      path: components
    components: [ld2410]

ld2410:
  id: ld2410_hub

output:
  - platform: ledc
    pin: GPIO0
    id: buzzer
    frequency: 1000Hz

rtttl:
  id: buzzer_rtttl
  output: buzzer
  gain: 80%

globals:
  # 校準用：每格的最大能量，偶數索引＝移動，奇數索引＝靜止
  - id: cal_max
    type: float[18]
  - id: cal_end_ms
    type: uint32_t
    initial_value: '0'
  - id: cal_samples
    type: int
    initial_value: '0'
  - id: cal_running
    type: bool
    initial_value: 'false'
  # 4.3.1：LED Follow Sensors 正在關閉中（template 開關的狀態要等關閉動作跑完才變，這段空檔不讓有人／PIR 把燈點亮）
  - id: led_follow_closing
    type: bool
    initial_value: 'false'
  # 校準用：每格取樣總和（算平均），索引同 cal_max
  - id: cal_sum
    type: float[18]
  # 2.9 雙點校準：坐著時每格靜止能量總和與筆數；最後要寫入的 18 個門檻（索引同 cal_max）
  - id: cal_sit_sum
    type: float[9]
  - id: cal_sit_ok
    type: int
    initial_value: '0'
  - id: cal_skip_sit
    type: bool
    initial_value: 'false'
  - id: cal_used_hist
    type: bool
    initial_value: 'false'
  - id: cal_sit_n
    type: int
    initial_value: '0'
  - id: cal_thr
    type: float[18]
  # 最近 20 次有人／無人轉換，一行一筆，最新在最前：「月-日 時:分:秒,1或0,距離cm,運動能量,靜止能量」
  - id: trigger_log_buf
    type: std::string

  # N9/N11: PIR vs radar mismatch count, energy spike count, smart delay state
  - id: pir_mismatch
    type: int
    initial_value: '0'
  - id: spike_count
    type: int
    initial_value: '0'
  - id: spike_active
    type: bool
    initial_value: 'false'
  # 3.3：工程模式下一次是誰開的（0 手動、1 校準、2 智慧延時重開、3 底噪漂移、4 歷史學習）
  - id: eng_owner_next
    type: int
    initial_value: '0'
  # 3.3：雷達重開後的穩定期（期間新出現的有人不算，PIR 例外）
  - id: settle_on
    type: bool
    initial_value: 'false'
  - id: smart_base
    type: float
    restore_value: yes
    initial_value: '0'
  - id: smart_mode
    type: int
    restore_value: yes
    initial_value: '0'
  - id: smart_last_ms
    type: uint32_t
    initial_value: '0'
  - id: smart_wrote
    type: bool
    initial_value: 'false'
  # 3.1 智慧延時由 ESP32 計時：smart_active＝雷達底層逾時已設成 1 秒；hold_ms＝雷達放開之後再保持多久；raw_last_ms＝雷達最後一次有人
  - id: smart_active
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: hold_ms
    type: uint32_t
    initial_value: '4000'
  - id: raw_last_ms
    type: uint32_t
    initial_value: '0'
  - id: tmo_synced
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: smart_eng
    type: bool
    initial_value: 'false'
  # 3.2 狀態機與殘留過濾：se_hist＝最近 10 秒的靜止能量（每秒一筆）；residue＝判定是離開後的殘留回波；
  # entry_ok＝這一刻的能量足以「從無人轉有人」（遲滯）；pres_on_ms＝最近一次轉有人的時間
  - id: se_hist
    type: float[60]
  - id: se_idx
    type: int
    initial_value: '0'
  - id: residue
    type: bool
    initial_value: 'false'
  - id: residue_s
    type: int
    initial_value: '0'
  - id: residue_min
    type: float
    initial_value: '0'
  - id: residue_since
    type: uint32_t
    initial_value: '0'
  - id: pres_on_ms
    type: uint32_t
    initial_value: '0'
  - id: pres_state
    type: int
    initial_value: '-1'
  # 3.9 進入確認：Radar Presence Raw 這一段連續有目標是從什麼時候開始（millis，沒目標時 0）
  - id: raw_rise_ms
    type: uint32_t
    initial_value: '0'
  # 4.0 遠處突跳封鎖：smart_prev_d＝上一秒最近目標距離（cm，沒目標 0）、far_block＝這段遠處目標是突跳來的、far_block_s＝已封鎖幾秒
  # 4.0 旗標掉線橋接中（Presence Reason 的 b 旗標；網頁據此不要說「人好像離開了」）
  # 4.1 雷達丟失保持：seat_cm＝座位距離（cm）、exit_ms＝最近一次「移動目標離座位 >= 150 cm」的時間（離開軌跡）
  # 4.1.1：seat_cm 改成最近 60 秒靜止距離的中位數（seat_hist 每秒一筆，0＝那一秒沒有人或沒有靜止目標）。
  #        原本用最新一筆，靜止距離一跳到 3.3–4.0 m 的鬼影，1.4 m 的動作就被當成離座
  - id: seat_cm
    type: float
    initial_value: '0'
  - id: seat_hist
    type: float[60]
  - id: seat_idx
    type: int
    initial_value: '0'
  # 4.1.1：pres_off_ms＝最近一次轉無人的時間（0＝還沒發生過）；e_run＝雷達旗標關著但靜止能量 >= Still Energy Presence 的連續秒數
  - id: pres_off_ms
    type: uint32_t
    initial_value: '0'
  - id: e_run
    type: int
    initial_value: '0'
  - id: exit_ms
    type: uint32_t
    initial_value: '0'
  # 4.3：seat_n＝最近 60 秒有幾秒「有人而且有靜止目標」（每秒算）；seat_n_l＝最後一次旗標驅動有人時的 seat_n。
  # Seated Lost Hold 要 seat_n_l >= 10 才撐：一直在動、從沒靜止過的人（走進來走出去）不算「坐著」
  # 4.3：off_res＝最近一次轉無人時殘留回波旗標是不是成立（殘留造成的無人，結束後人還在，不再被進入遲滯擋）
  - id: seat_n
    type: int
    initial_value: '0'
  - id: seat_n_l
    type: int
    initial_value: '0'
  - id: off_res
    type: bool
    initial_value: 'false'
  # 4.2 離開區：zone_ms＝最近一次（旗標驅動的）雷達目標出現在 Exit Zone Near～Far 公分內的時間（0＝還沒有）
  - id: zone_ms
    type: uint32_t
    initial_value: '0'
  - id: bridging
    type: bool
    initial_value: 'false'
  - id: smart_prev_d
    type: int
    initial_value: '0'
  - id: far_block
    type: bool
    initial_value: 'false'
  - id: far_block_s
    type: int
    initial_value: '0'
  # 3.8 狀態字平滑：pres_shown＝目前對外顯示的狀態、pres_cand＝候選狀態、pres_cand_s＝候選已連續幾秒
  - id: pres_shown
    type: int
    initial_value: '-1'
  - id: pres_cand
    type: int
    initial_value: '-1'
  - id: pres_cand_s
    type: int
    initial_value: '0'
  # 3.8 區輸出最短保持：zone_raw＝這一刻的原始判定、zone_last＝最近一次原始判定為有人的時間
  - id: zone_raw
    type: uint8_t[2]
    initial_value: '{0, 0}'
  - id: zone_last
    type: uint32_t[2]
    initial_value: '{0, 0}'
  # 3.8 校準品質不穩（供狀態字「完成（有警告）」與中止判斷）
  - id: cal_unstable
    type: bool
    initial_value: 'false'
  - id: cal_hard_unstable
    type: bool
    initial_value: 'false'
  # 3.8 校準前備份（Calibration Backup；寫入前自動存，Restore Calibration 可重複還原）與備份時間（epoch）
  - id: cal_bak
    type: float[18]
    restore_value: yes
  - id: cal_bak_ok
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: cal_bak_at
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # 3.2 校準：空房取樣中止與第二點驗證
  - id: cal_sample_ms
    type: uint32_t
    initial_value: '0'
  - id: cal_abort_n
    type: int
    initial_value: '0'
  - id: cal_aborted
    type: bool
    initial_value: 'false'
  - id: cal_seat_sig
    type: int
    initial_value: '0'
  - id: cal_lowered
    type: int
    initial_value: '0'
  - id: cal_verify
    type: int
    initial_value: '-1'
  # 2.9: consecutive 1 s ticks of near-still / far-only evidence
  - id: smart_near_s
    type: int
    initial_value: '0'
  - id: smart_far_s
    type: int
    initial_value: '0'
  # 2.9: set while smart delay re-opens engineering mode, so the auto-off timer is not restarted
  - id: eng_reopen
    type: bool
    initial_value: 'false'
  # 2.9 spike: last time presence or PIR was on (room counts as surely empty 30 s after)
  - id: busy_ms
    type: uint32_t
    initial_value: '0'
  # 2.5 floor drift: EMA of mean still energy while the room is empty (engineering mode on)
  - id: floor_n
    type: int
    initial_value: '0'
  - id: floor_level
    type: float
    initial_value: '0'
  - id: floor_ref
    type: float
    restore_value: yes
    initial_value: '-1'
  - id: empty_since
    type: uint32_t
    initial_value: '0'
  - id: link_drops
    type: int
    initial_value: '0'
  - id: link_attempts
    type: int
    initial_value: '0'
  - id: link_was_ok
    type: bool
    initial_value: 'true'
  # 3.0 history learning. Histograms: 18 rows (even = moving, odd = still, gate = row / 2) x 101 bins (energy 0..100).
  # hq = surely empty room, ho = person confirmed (only the target's gate). Live copies in RAM, *_save are the
  # flash copies written once an hour (writing the live ones would hit flash every 30 s).
  - id: hq
    type: uint16_t[1818]
  - id: ho
    type: uint16_t[1818]
  - id: hq_save
    type: uint16_t[1818]
    restore_value: yes
  - id: ho_save
    type: uint16_t[1818]
    restore_value: yes
  - id: hist_thr
    type: float[18]
  - id: hist_ready
    type: bool
    initial_value: 'false'
  - id: hist_changes
    type: int
    initial_value: '0'
  - id: hist_clamp
    type: bool
    initial_value: 'false'
  - id: hist_busy_ms
    type: uint32_t
    initial_value: '0'
  - id: hist_pir_ms
    type: uint32_t
    initial_value: '0'
  - id: hist_occ_eng_ms
    type: uint32_t
    initial_value: '0'
  # thresholds before the last History Apply (for History Undo) and when it happened (epoch, for the 7-day rule)
  - id: thr_bak
    type: float[18]
    restore_value: yes
  - id: thr_bak_ok
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: hist_last_apply
    type: uint32_t
    restore_value: yes
    initial_value: '0'

binary_sensor:
  - platform: status
    name: "API Connection"
    entity_category: diagnostic
  # 3.1：雷達原始有人（internal），對外的 Radar Presence 是下面的範本實體（智慧延時開著時由 ESP32 計時）
  - platform: ld2410
    has_target:
      name: "Radar Presence Raw"
      id: presence_raw
      internal: true
      on_state:
        then:
          - lambda: 'id(raw_rise_ms) = x ? millis() : 0;'
    has_moving_target:
      name: "Radar Moving Target"
      id: radar_moving
      on_state:
        then:
          - script.execute: zone_eval
    has_still_target:
      name: "Radar Still Target"
      id: radar_still
      on_state:
        then:
          - script.execute: zone_eval
  # 3.3 機器讀的布林
  - platform: template
    name: "Low Memory"
    id: low_mem_bs
    device_class: problem
    entity_category: diagnostic
    # 3.7：有 lambda 的範本 binary sensor 每圈主迴圈都會執行一次；記憶體不需要這麼勤，改成在每 10 秒的 interval 裡發布
  - platform: template
    name: "Calibration Active"
    id: cal_active_bs
    entity_category: diagnostic
  - platform: template
    name: "Calibration Used History"
    id: cr_used_hist
    entity_category: diagnostic
  - platform: template
    name: "Calibration Seated Skipped"
    id: cr_seat_skipped
    entity_category: diagnostic
  - platform: template
    name: "Calibration Seat Seen"
    id: cr_seat_seen
    entity_category: diagnostic
  - platform: template
    name: "Radar Settling"
    id: radar_settling
    entity_category: diagnostic
  - platform: template
    name: "PIR Mismatch Now"
    id: pir_mm_now
    entity_category: diagnostic
  - platform: template
    name: "Radar Presence"
    id: presence
    lambda: |-
      bool raw = id(presence_raw).state;
      bool by_energy = false;
      id(bridging) = false;
      // 4.1.1：雷達旗標關著，但靜止能量 >= Still Energy Presence 已連續 2 秒，也算雷達有目標（限最近有人過；0＝關）。
      // 旗標掉線後多半要等移動目標出現才會回來，坐著不動時即使靜止能量高也可能等不到旗標。只在智慧延時開著時作用
      if (!raw && id(smart_active) && id(e_run) >= 2 && id(raw_last_ms) != 0) {
        float ls0 = id(lost_hold_s).state;
        uint32_t win = (uint32_t) (std::max(60.0f, std::isnan(ls0) ? 0.0f : ls0) * 1000.0f);
        if (id(presence).state || millis() - id(raw_last_ms) < win) { raw = true; by_energy = true; }
      }
      // 3.3：雷達設定寫入、重開後約 12 秒的穩定期，新出現的有人不算（PIR 有動作除外）
      if (raw && id(settle_on) && !id(presence).state && !id(motion).state) raw = false;
      // 3.2：智慧延時開著時，殘留回波不算有人；無人→有人要過遲滯（能量高於該格門檻＋餘裕，或 PIR）
      if (raw && id(smart_active)) {
        if (id(residue)) raw = false;
        else if (!by_energy && !id(presence).state && !id(motion).state) {
          float res = ${radar_res_m};
          float h = id(hyst_margin).state; if (std::isnan(h)) h = 0;
          number::Number *mt[9] = {${gates_thr_move_9}};
          number::Number *st[9] = {${gates_thr_still_9}};
          // 4.3：剛因殘留回波轉無人（60 秒內），殘留結束後人還在，不再要求「門檻＋遲滯」
          bool ok = h <= 0 || (id(off_res) && id(pres_off_ms) != 0 && millis() - id(pres_off_ms) <= 60000);
          float md = id(radar_move_dist).state, me = id(radar_move_energy).state;
          float sd = id(radar_still_dist).state, se = id(radar_still_energy).state;
          if (!ok && id(radar_moving).state && !std::isnan(md) && !std::isnan(me)) {
            int g = std::min(8, std::max(0, (int) (md / res))); float t = mt[g]->state;
            ok = std::isnan(t) || me >= t + h;
          }
          if (!ok && id(radar_still).state && !std::isnan(sd) && !std::isnan(se)) {
            int g = std::min(8, std::max(0, (int) (sd / res))); float t = st[g]->state;
            ok = std::isnan(t) || se >= t + h;
          }
          if (!ok) raw = false;
        }
      }
      // 3.9：無人→有人要雷達連續有目標 Entry Confirm Seconds 秒才算（PIR 有動作立刻算；0＝關）。
      // 擋空房每約 30 分鐘一次、只亮 1 秒的單幀突波
      if (raw && !by_energy && !id(presence).state && !id(motion).state) {
        float ec = id(entry_confirm_s).state;
        // 4.0.1：開機時雷達旗標已經是 ON 沒有上升緣，raw_rise_ms 會一直是 0 而永遠擋住；0 視為「現在才開始算」
        if (id(raw_rise_ms) == 0) id(raw_rise_ms) = millis();
        if (!std::isnan(ec) && ec > 0 && millis() - id(raw_rise_ms) < (uint32_t) (ec * 1000.0f)) raw = false;
      }
      if (raw) {
        // 4.1.1：seat_cm 由 smart_delay_tick 每秒算（60 秒中位數），這裡只判斷離座軌跡
        float md0 = id(radar_move_dist).state;
        if (id(radar_moving).state && !std::isnan(md0) && id(seat_cm) > 0 && fabsf(md0 - id(seat_cm)) >= 150.0f) id(exit_ms) = millis();
        // 靠能量算有人時雷達沒有目標位置，區輸出與橋接一樣維持原值
        if (by_energy) id(bridging) = true;
        // 4.2 離開區：旗標驅動的目標（不含靠能量算有人）出現在 Exit Zone Near～Far 公分內，就記下時間
        if (!by_energy) id(seat_n_l) = id(seat_n);
        if (!by_energy) {
          float zn = id(exit_near).state, zf = id(exit_far).state, md1 = id(radar_move_dist).state, sd1 = id(radar_still_dist).state;
          if (!std::isnan(zn) && !std::isnan(zf) && zf > zn &&
              ((id(radar_moving).state && !std::isnan(md1) && md1 >= zn && md1 <= zf) ||
               (id(radar_still).state && !std::isnan(sd1) && sd1 >= zn && sd1 <= zf)))
            id(zone_ms) = millis();
        }
        id(raw_last_ms) = millis(); return true;
      }
      if (!id(smart_active) || id(raw_last_ms) == 0) return false;
      // 4.0：保持時間只能延續「已經是有人」的狀態。否則縮短保持到期轉無人後，狀態變 Empty、hold_ms 回到基本值，
      // 剛過的 2–3 秒又小於它，會多亮 1–2 秒
      if (!id(presence).state) return false;
      // 4.2 離開區：旗標剛消失，消失前 Exit Zone Seconds 秒內目標還在門口那段距離，靜止能量已低於 Exit Zone Max Energy，
      // 而且 PIR 也沒亮，就直接轉無人（不給橋接、Lost Hold、保持）。PIR 還亮著不轉：站在門口時雷達旗標會斷續掉線，PIR 卻是亮的
      // Exit Zone Seconds 0＝關
      {
        float zw = id(exit_win_s).state, ze = id(exit_e).state, se2 = id(radar_still_energy).state;
        if (!std::isnan(zw) && zw > 0 && !std::isnan(ze) && !std::isnan(se2) && se2 < ze && id(zone_ms) != 0 && !id(motion).state &&
            id(raw_last_ms) - id(zone_ms) <= (uint32_t) (zw * 1000.0f)) { id(bridging) = false; return false; }
      }
      // 4.0：雷達旗標掉線但靜止能量仍高（>= Dropout Bridge Energy）時，視為仍有人，從最後一次真有目標起最多撐 Dropout Bridge Seconds 秒
      // 靜止坐著的人旗標掉線時能量仍接近滿格；真正的空房掉線時能量不會長時間偏高。
      {
        float be = id(bridge_e).state, bs = id(bridge_s).state, se = id(radar_still_energy).state;
        if (!std::isnan(be) && !std::isnan(bs) && !std::isnan(se) && be > 0 && bs > 0 && se >= be && !id(residue) &&
            millis() - id(raw_last_ms) < (uint32_t) (bs * 1000.0f)) { id(bridging) = true; return true; }
      }
      // 4.1：雷達丟失保持。人已在場 >= 60 秒、掉線前 15 秒沒有「離開座位的移動軌跡」時，
      // 視為雷達暫時丟了靜止人體。
      // 最多撐 Seated Lost Hold Seconds 秒；雷達旗標回來或出現離座的移動軌跡就回到正常判斷（0＝關）
      {
        float ls = id(lost_hold_s).state;
        uint32_t now = millis();
        // 4.3：60 秒資格在「掉線當下」（raw_last_ms）比，不是在判定當下比（原本在判定當下比，掉線後靠保持時間就能取得資格）
        // 4.3：還要掉線前 60 秒內至少 10 秒有靜止目標（真的「坐著」過）；seat_n_l 見上方全域說明
        if (!std::isnan(ls) && ls > 0 && (int32_t) (id(raw_last_ms) - id(pres_on_ms)) >= 60000 && id(seat_n_l) >= 10 && !id(residue) &&
            (id(exit_ms) == 0 || id(exit_ms) + 15000 < id(raw_last_ms)) &&
            now - id(raw_last_ms) < (uint32_t) (ls * 1000.0f)) { id(bridging) = true; return true; }
      }
      id(bridging) = false;
      return millis() - id(raw_last_ms) < id(hold_ms);
    on_press:
      then:
        # 4.1.1：無人的間隔 <= 60 秒就沿用原本的轉有人時間。原本每次都重設，一次短暫誤判無人之後的 60 秒內
        # Seated Lost Hold 沒有資格、保持也回到基本值，誤判會連鎖
        - lambda: |-
            uint32_t now = millis();
            if (id(pres_off_ms) == 0 || now - id(pres_off_ms) > 60000) id(pres_on_ms) = now;
        - lambda: |-
            auto tm = id(sntp_time).now();
            if (tm.is_valid()) id(presence_changed_at).publish_state(ESPTime::from_epoch_utc(tm.timestamp).strftime("%Y-%m-%dT%H:%M:%SZ"));
        - script.execute: zone_eval
        - script.execute:
            id: log_trigger
            present: true
        - if:
            condition:
              lambda: 'return id(led_follow).state && !id(led_follow_closing);'
            then:
              - light.turn_on:
                  id: ws2812_left
                  brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                  effect: "Left Flow"
    on_release:
      then:
        - lambda: |-
            id(pres_off_ms) = millis();
            if (id(pres_off_ms) == 0) id(pres_off_ms) = 1;
            id(off_res) = id(residue);
            auto tm = id(sntp_time).now();
            if (tm.is_valid()) id(presence_changed_at).publish_state(ESPTime::from_epoch_utc(tm.timestamp).strftime("%Y-%m-%dT%H:%M:%SZ"));
        - script.execute: zone_eval
        - script.execute:
            id: log_trigger
            present: false
        - if:
            condition:
              switch.is_on: led_follow
            then:
              - light.turn_off: ws2812_left
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
    name: "PIR Motion"
    id: motion
    filters:
      - delayed_off: !lambda |-
          float h = id(pir_hold_s).state; if (std::isnan(h)) h = 5;
          return (uint32_t) (h * 1000.0f);
    on_press:
      then:
        - script.execute: pir_check
        - if:
            condition:
              lambda: 'return id(led_follow).state && !id(led_follow_closing);'
            then:
              - light.turn_on:
                  id: ws2812_right
                  brightness: !lambda 'return id(led_brightness).state / 100.0f;'
                  effect: "Right Flow"
    on_release:
      then:
        - if:
            condition:
              switch.is_on: led_follow
            then:
              - light.turn_off: ws2812_right
  # 4.2：拿掉 GPIO7「Radar OUT Pin」與 UART「Radar OUT Status」：原廠韌體沒有用 OUT 腳，加的實體實測從未變 ON，
  # UART 狀態又只有工程模式才有值、等於「雷達有人」的重複資訊。「Radar OUT Pin Level」「Radar Light Function」是雷達內部設定，保留

  - platform: template
    name: "Radar Link"
    id: radar_link
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    name: "Zone 1 Occupied"
    id: zone1_occupied
  - platform: template
    name: "Zone 2 Occupied"
    id: zone2_occupied

sensor:
  # 3.1 目前實際的無人逾時（智慧延時延長／縮短後的值；關著時＝Radar Presence Timeout）
  - platform: template
    name: "Presence Hold"
    id: presence_hold
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  # 3.0 history learning progress (hours of empty-room samples on the least-sampled gate; 20000 samples = 5.6 h = ready)
  - platform: template
    name: "History Empty Hours"
    id: hist_q_hours
    unit_of_measurement: "h"
    accuracy_decimals: 1
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    name: "History Occupied Samples"
    id: hist_o_n
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    name: "History Changes"
    id: hist_changes_s
    entity_category: diagnostic
  - platform: template
    name: "Radar Link Drops"
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: 'return id(link_drops);'
    filters:
      - delta: 0.5
  - platform: template
    name: "Radar Floor Level"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: 'if (id(floor_n) < 6) return NAN; return id(floor_level);'
    filters:
      - delta: 0.2
  - platform: template
    name: "Radar Floor Drift"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: 'if (id(floor_n) < 6 || id(floor_ref) < 0) return NAN; return id(floor_level) - id(floor_ref);'
    filters:
      - delta: 0.2
  - platform: template
    name: "Radar Target State"
    icon: "mdi:radar"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return id(ld2410_hub)->get_target_state_raw();'
    filters:
      - delta: 0.5
  - platform: template
    name: "Radar PIR Mismatch Count"
    state_class: total_increasing
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(pir_mismatch);'
    filters:
      - delta: 0.5
  # 3.3 機器讀的數值（時間類改用文字感測器、UTC ISO 字串：float 存 epoch 只準到約 2 分鐘）
  - platform: template
    name: "Calibration Total Seconds"
    id: cal_total_s
    unit_of_measurement: s
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Calibration Samples"
    id: cr_samples
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Calibration Seat Gates"
    id: cr_seat_gates
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Last Spike Gate"
    id: last_spike_gate
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Radar Energy Spike Count"
    state_class: total_increasing
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    # 2.9: count only when the room is surely empty (radar and PIR off for 30 s). With a person in the room a gate
    # at 100 is normal saturation, so it is not counted.
    lambda: |-
      uint32_t now = millis();
      if (id(presence).state || id(motion).state) id(busy_ms) = now;
      float win = id(spike_window).state; if (std::isnan(win)) win = 30;
      bool quiet = !id(presence).state && !id(motion).state && now - id(busy_ms) >= (uint32_t) (win * 1000);
      sensor::Sensor *ge[18] = {${gates_energy_all_18}};
      int sg = -1;
      if (quiet && id(ld2410_engineering).state)
        for (int i = 0; i < 18 && sg < 0; i++) if (ge[i]->state >= 100) sg = i / 2;
      bool spike = sg >= 0;
      if (spike && !id(spike_active)) {
        id(spike_count)++;
        id(last_spike_gate).publish_state(sg);
        auto tm = id(sntp_time).now();
        if (tm.is_valid()) id(last_spike_time).publish_state(ESPTime::from_epoch_utc(tm.timestamp).strftime("%Y-%m-%dT%H:%M:%SZ"));
      }
      id(spike_active) = spike;
      return id(spike_count);
    filters:
      - delta: 0.5
  - platform: aht10
    variant: AHT20
    address: 0x38
    update_interval: 10s
    temperature:
      name: "Temperature"
      id: temperature
      filters:
        - lambda: |-
            float o = id(temp_offset).state;
            return x + (std::isnan(o) ? 0.0f : o);
    humidity:
      name: "Humidity"
      id: humidity
      filters:
        - lambda: |-
            float o = id(humi_offset).state;
            return x + (std::isnan(o) ? 0.0f : o);
        - clamp:
            min_value: 0
            max_value: 100
  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    update_interval: 5s
    # 3.7：數值常與上一筆相同。變化超過 2 lx 就送，沒變化最多每 60 秒送一次（網頁仍看得到更新）
    filters:
      - or:
          - delta: 2
          - throttle: 60s
  - platform: ld2410
    moving_distance:
      name: "Radar Moving Distance"
      id: radar_move_dist
      # 3.2：中位數平滑（距離讀值常會跳動）
      filters:
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
      on_value:
        then:
          - script.execute: zone_eval
    still_distance:
      name: "Radar Still Distance"
      id: radar_still_dist
      # 3.2：中位數平滑（距離讀值常會跳動）
      filters:
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
      on_value:
        then:
          - script.execute: zone_eval
    detection_distance:
      name: "Radar Detection Distance"
      id: radar_detect_dist
      filters:
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
    moving_energy:
      name: "Radar Moving Energy"
      id: radar_move_energy
    still_energy:
      name: "Radar Still Energy"
      id: radar_still_energy
    light:
      name: "Radar Light"
    g0:
      move_energy:
        name: "Gate 0 Move Energy"
        id: g0_move_energy
        filters: &gate_energy_filters
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 500ms
        entity_category: diagnostic
      still_energy:
        name: "Gate 0 Still Energy"
        id: g0_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g1:
      move_energy:
        name: "Gate 1 Move Energy"
        id: g1_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 1 Still Energy"
        id: g1_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g2:
      move_energy:
        name: "Gate 2 Move Energy"
        id: g2_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 2 Still Energy"
        id: g2_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g3:
      move_energy:
        name: "Gate 3 Move Energy"
        id: g3_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 3 Still Energy"
        id: g3_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g4:
      move_energy:
        name: "Gate 4 Move Energy"
        id: g4_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 4 Still Energy"
        id: g4_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g5:
      move_energy:
        name: "Gate 5 Move Energy"
        id: g5_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 5 Still Energy"
        id: g5_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g6:
      move_energy:
        name: "Gate 6 Move Energy"
        id: g6_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 6 Still Energy"
        id: g6_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g7:
      move_energy:
        name: "Gate 7 Move Energy"
        id: g7_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 7 Still Energy"
        id: g7_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
    g8:
      move_energy:
        name: "Gate 8 Move Energy"
        id: g8_move_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
      still_energy:
        name: "Gate 8 Still Energy"
        id: g8_still_energy
        filters: *gate_energy_filters
        entity_category: diagnostic
  - platform: internal_temperature
    name: "Chip Temperature"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Largest Block"
    loop_time:
      name: "Loop Time"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

# 雷達可調項。門檻、逾時、最遠距離格都存在雷達裡，不必重刷
number:
  - platform: template
    name: "Radar Link Timeout"
    id: radar_link_timeout
    optimistic: true
    min_value: 2
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    entity_category: config
  - platform: template
    name: "Zone 1 Start Gate"
    id: zone1_start
    on_value:
      then:
        - script.execute: zone_eval
    optimistic: true
    min_value: 0
    max_value: 8
    step: 1
    initial_value: 0
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Zone 1 End Gate"
    id: zone1_end
    on_value:
      then:
        - script.execute: zone_eval
    optimistic: true
    min_value: 0
    max_value: 8
    step: 1
    initial_value: 3
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Zone 2 Start Gate"
    id: zone2_start
    on_value:
      then:
        - script.execute: zone_eval
    optimistic: true
    min_value: 0
    max_value: 8
    step: 1
    initial_value: 4
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Zone 2 End Gate"
    id: zone2_end
    on_value:
      then:
        - script.execute: zone_eval
    optimistic: true
    min_value: 0
    max_value: 8
    step: 1
    initial_value: 8
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Delay Extend Still Near"
    id: delay_extend
    optimistic: true
    min_value: 0
    max_value: 120
    step: 1
    initial_value: 10
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    entity_category: config
  - platform: template
    name: "Delay Near Range"
    id: delay_near
    optimistic: true
    min_value: 0
    max_value: 8
    step: 1
    initial_value: 3
    restore_value: true
    unit_of_measurement: "gate"
    mode: box
    entity_category: config
  - platform: template
    name: "Delay Shorten Move Away"
    id: delay_shorten
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 2
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    entity_category: config
  # 3.3：智慧延時的兩個判斷秒數、突波的空房時間（原本寫死 10、2、30）
  - platform: template
    name: "Delay Still Near Seconds"
    id: delay_still_s
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  - platform: template
    name: "Delay Move Away Seconds"
    id: delay_away_s
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 2
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  - platform: template
    name: "Spike Window Seconds"
    id: spike_window
    optimistic: true
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 30
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 3.4：殘留回波與進入期的常數改為可調（原本寫死 8、60、3、5、60、10）。預設值＝3.3 的行為，燒錄後行為不變；
  # 其中「降幅」「能量上限」「回升」與位置、能量尺度有關，預設只是暫定值，
  # 不一定適合每個場地，換地點要自己調。時間類（確認秒數、最長維持、進入期）與環境無關。
  # 4.1.1：Residue Drop 可設 0＝關閉殘留規則，預設為 0。這條規則只作用在「門檻」與「能量上限」之間的能量帶，
  # 那正好是坐定後的能量，容易把坐著的人誤判成殘留，所以預設關閉
  - platform: template
    name: "Residue Drop"
    id: residue_drop
    optimistic: true
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 0
    restore_value: true
    entity_category: config
  - platform: template
    name: "Residue Max Energy"
    id: residue_max_e
    optimistic: true
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 35
    restore_value: true
    entity_category: config
  - platform: template
    name: "Residue Rebound"
    id: residue_rebound
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    restore_value: true
    entity_category: config
  - platform: template
    name: "Residue Confirm Seconds"
    id: residue_confirm_s
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 4
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  - platform: template
    name: "Residue Max Seconds"
    id: residue_max_s
    optimistic: true
    min_value: 10
    max_value: 300
    step: 5
    initial_value: 60
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 3.8：區 1／區 2 有人輸出最短保持秒數（0＝關）；狀態字（Presence State）換狀態前要連續幾秒（0＝關）
  # 3.8 校準取樣最大波動達到這個值就中止（不寫門檻）；介於 Calibration Spread Limit 與這個值之間只警告
  - platform: template
    name: "Calibration Abort Spread"
    id: cal_abort_spread
    optimistic: true
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 40
    restore_value: true
    entity_category: config
  - platform: template
    name: "Zone Hold Seconds"
    id: zone_hold_s
    optimistic: true
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 4
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  - platform: template
    name: "State Smooth Seconds"
    id: state_smooth_s
    optimistic: true
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 3
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 3.9：無人→有人要雷達連續有目標幾秒才算（PIR 有動作立刻算；0＝關）。預設 2：擋單幀突波，真進房多約 1 秒
  - platform: template
    name: "Entry Confirm Seconds"
    id: entry_confirm_s
    optimistic: true
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 2
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 4.0：雷達旗標掉線但靜止能量 >= 這個值時仍算有人（0＝關），最多撐 Dropout Bridge Seconds 秒（0＝關）
  - platform: template
    name: "Dropout Bridge Energy"
    id: bridge_e
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 60
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Dropout Bridge Seconds"
    id: bridge_s
    optimistic: true
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 60
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 4.1：雷達旗標掉線、人已在場 60 秒以上且沒有離座軌跡時，最多保持幾秒（0＝關）
  - platform: template
    name: "Seated Lost Hold Seconds"
    id: lost_hold_s
    optimistic: true
    min_value: 0
    max_value: 600
    step: 1
    initial_value: 180
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 4.1.1：雷達旗標關著但靜止能量 >= 這個值連續 2 秒，也算雷達有目標（0＝關）。與雷達能量大小有關，換地點要先確認空房能量上限
  - platform: template
    name: "Still Energy Presence"
    id: energy_pres
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
  # 4.2 離開區（預設全關＝Exit Zone Seconds 0；距離與場地有關，換地點要重新量）：人離開前雷達目標常先出現在門口附近的一段距離，
  # 之後旗標消失且靜止能量回到空房水準（< Exit Zone Max Energy）、PIR 也沒亮，就直接轉無人，不給橋接、Lost Hold 與保持。
  # 設定方式：在門口附近走動，記下雷達讀到的距離範圍與空房的靜止能量，再據此設定距離範圍、秒數與能量；各場地要自己量
  - platform: template
    name: "Exit Zone Near"
    id: exit_near
    optimistic: true
    min_value: 0
    max_value: 900
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: cm
    entity_category: config
  - platform: template
    name: "Exit Zone Far"
    id: exit_far
    optimistic: true
    min_value: 0
    max_value: 900
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: cm
    entity_category: config
  - platform: template
    name: "Exit Zone Seconds"
    id: exit_win_s
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  - platform: template
    name: "Exit Zone Max Energy"
    id: exit_e
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 15
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
  # 4.1：自動亮的燈（有人／PIR 跑馬、Wi-Fi 斷線閃紅、校準呼吸）共用的亮度
  - platform: template
    name: "LED Brightness"
    id: led_brightness
    optimistic: true
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Entering Seconds"
    id: entering_s
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  # 3.4：寫死的時間／統計常數全部改為可調數字（預設值＝3.3 的寫死值，燒錄後行為不變）。
  # 與環境無關的值，預設即為目前最佳值；仍可依需要調整。
  - platform: template
    name: "Floor Wait Seconds"
    id: floor_wait_s
    optimistic: true
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 60
    restore_value: true
    unit_of_measurement: "s"
    entity_category: config
  - platform: template
    name: "Floor Window Samples"
    id: floor_window
    optimistic: true
    min_value: 30
    max_value: 1000
    step: 10
    initial_value: 180
    restore_value: true
    entity_category: config
  - platform: template
    name: "Floor Sample Interval Minutes"
    id: floor_every_min
    optimistic: true
    min_value: 10
    max_value: 120
    step: 5
    initial_value: 30
    restore_value: true
    unit_of_measurement: "min"
    entity_category: config
  - platform: template
    name: "Occupied Sample Interval Minutes"
    id: occ_every_min
    optimistic: true
    min_value: 10
    max_value: 240
    step: 5
    initial_value: 60
    restore_value: true
    unit_of_measurement: "min"
    entity_category: config
  - platform: template
    name: "PIR Recent Seconds"
    id: pir_recent_s
    optimistic: true
    min_value: 30
    max_value: 1800
    step: 30
    initial_value: 300
    restore_value: true
    unit_of_measurement: "s"
