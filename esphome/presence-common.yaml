  - platform: template
    name: "Radar Presence Timeout"
    id: radar_timeout
    optimistic: true
    min_value: 0
    max_value: 3600
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    entity_category: config
    on_value:
      then:
        - lambda: |-
            if (id(smart_active) || !id(tmo_synced) || !id(radar_timeout_hw).has_state()) return;
            if (fabsf(id(radar_timeout_hw).state - x) < 0.5f) return;
            auto call = id(radar_timeout_hw).make_call();
            call.set_value(x);
            call.perform();
