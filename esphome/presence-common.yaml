select:
  # 3.3 無人逾時情境（秒數只放這裡；目前值對不上任何一項時顯示 Custom）
  - platform: template
    name: "Presence Timeout Preset"
    id: timeout_preset
    options: ["Work 60 s", "Sleep 120 s", "Away 5 s", "Custom"]
    initial_option: "Custom"
    optimistic: true
    entity_category: config
    set_action:
      - lambda: |-
          float v = x == "Work 60 s" ? 60 : x == "Sleep 120 s" ? 120 : x == "Away 5 s" ? 5 : -1;
          if (v < 0) return;
          auto c = id(radar_timeout).make_call(); c.set_value(v); c.perform();
  - platform: ld2410
    distance_resolution:
      name: "Radar Distance Resolution"
      id: radar_res
      on_value:
        # 3.4：改解析度也會讓雷達重開 → 選項真的變了才開穩定期
        - lambda: |-
            static std::string last;
            if (!last.empty() && last != x) id(radar_settle).execute();
            last = x;
    light_function:
      name: "Radar Light Function"
    out_pin_level:
      name: "Radar OUT Pin Level"

switch:
  # N11 smart delay (default off): still target near for 10 s -> extend; all targets far for 2 s -> shorten;
  # presence off or switch off restores the base timeout. Each write restarts the radar (2-3 s blind, engineering
  # mode drops), so writes are rare: see smart_delay_tick.
  - platform: template
    name: "Smart Delay"
    id: smart_delay
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  # 2.9 雙點校準開關（預設關）：開著時裝置端校準在空房取樣後多一段「坐著取樣」，靜止門檻不會設到把坐著的人漏掉
  - platform: template
    name: "Calibration Two Point"
    id: cal_two
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  # 3.8 校準品質「不穩」時不寫入門檻（預設開）；關掉則照寫但狀態標示警告
  # 4.3.2：「這顆做過校準」旗標，重開機保留（校準完成時間是執行期文字，重開就清空，不能拿來判斷）。
  # 網頁的調校精靈／橫幅靠它判斷要不要提示；校準成功時自動開，原廠重置時關，也可手動開關。
  - platform: template
    name: "Calibration Done"
    id: calibration_done
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: diagnostic
  - platform: template
    name: "Calibration Block Unstable"
    id: cal_block_unstable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  # 3.0 歷史學習（預設開，只收資料不改門檻）與自動套用（預設關）
  - platform: template
    name: "History Learning"
    id: hist_learn
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "History Auto Apply"
    id: hist_auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: ld2410
    engineering_mode:
      name: "Radar Engineering Mode"
      id: ld2410_engineering
      # 開著會讓雷達持續回報各格能量、裝置負擔變高：開了就計時，逾時自動關（保險）
      # 2.9: a re-open after a smart-delay write keeps the original deadline (2.8 restarted it on every write)
      on_turn_on:
        - lambda: |-
            static const char *const OW[5] = {"user", "calibration", "smart_reopen", "floor_drift", "history"};
            int o = id(cal_running) ? 1 : (id(eng_reopen) ? 2 : id(eng_owner_next));
            id(eng_owner_next) = 0;
            // 智慧延時重開時沿用原本的擁有者以外的標記（磚據此不標警告）
            id(eng_owner_ts).publish_state(OW[o < 0 || o > 4 ? 0 : o]);
        - if:
            condition:
              lambda: 'return id(eng_reopen) && id(eng_auto_off).is_running();'
            then:
              - lambda: 'id(eng_reopen) = false;'
            else:
              - lambda: 'id(eng_reopen) = false;'
              - script.execute: eng_auto_off
      on_turn_off:
        - lambda: |-
            if (!id(eng_reopen)) {
              id(eng_owner_ts).publish_state("off");
              id(eng_off_at).publish_state("");
            }
  # 雷達自帶藍牙開關（進階，小心）：關掉後只能讓感應器斷電再上電 5 次以上才能重開，網頁與 HA 都開不回來。
  # 狀態由「Radar MAC」查詢結果推得（沒有 MAC 就當成關），不是雷達直接回報；不還原、不在開機時寫入
  - platform: ld2410
    bluetooth:
      name: "Radar Bluetooth"
      id: radar_bluetooth
      restore_mode: DISABLED
  # 蜂鳴器與報時預設全關
  - platform: template
    name: "Sounds"
    id: sounds
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Hourly Chime"
    id: hourly_chime
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  # 燈珠預設關：開了才會跟著有人、PIR 跑馬；燈本身仍可在網頁或 HA 手動開
  - platform: template
    name: "LED Follow Sensors"
    id: led_follow
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    # 4.2：打開當下若已經有人／PIR 有動作，立刻亮（原本只在下一次有人／PIR 轉變時才亮）
    # template 開關在動作跑完之後才更新自己的狀態，所以先等一下再同步，否則 led_sync 還讀到舊的「關」而什麼都不做
    turn_on_action:
      - lambda: 'id(led_follow_closing) = false;'
      - delay: 300ms
      - script.execute: led_sync
    # 4.3.1：關閉時①先設「關閉中」旗標，讓這段空檔的有人／PIR 觸發不再點燈 ②左右兩段立即熄（不漸暗）
    # ③1 秒後若仍是關著、且燈珠沒被校準或 Wi-Fi 斷線閃紅占用，把整條 6 顆像素強制寫成黑色，清掉可能殘留的跑馬像素
    turn_off_action:
      - lambda: 'id(led_follow_closing) = true;'
      - light.turn_off:
          id: ws2812_left
          transition_length: 0s
      - light.turn_off:
          id: ws2812_right
          transition_length: 0s
      - delay: 1s
      - if:
          condition:
            lambda: 'return !id(led_follow).state && !id(cal_running) && !(id(led_status).state && !wifi::global_wifi_component->is_connected());'
          then:
            - light.addressable_set:
                id: ws2812
                range_from: 0
                range_to: 5
                red: 0%
                green: 0%
                blue: 0%
      - lambda: 'id(led_follow_closing) = false;'
  # 狀態燈預設關：開了，校準時 6 顆藍色呼吸，Wi-Fi 斷線時 6 顆紅色閃爍
  - platform: template
    name: "LED Status Indicator"
    id: led_status
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

button:
  - platform: template
    name: "Radar Floor Reference Reset"
    entity_category: config
    on_press:
      - lambda: 'id(floor_ref) = (id(floor_n) >= 6) ? id(floor_level) : -1.0f;'
  - platform: template
    name: "Radar Factory Calibrate"
    id: radar_factory_cal_btn
    icon: "mdi:tune-variant"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: 'return !id(cal_running);'
          then:
            - lambda: 'id(ld2410_hub)->start_factory_calibration(60);'
            - script.execute: radar_settle
            # 校準完成後雷達內門檻已改寫，等 75 秒後重讀，網頁與 HA 才會跟上（不重讀會停在舊值）
            - delay: 75s
            - button.press: radar_query_btn
  - platform: ld2410
    restart:
      name: "Radar Restart"
      id: radar_restart_btn
    query_params:
      name: "Radar Query Params"
