text_sensor:
  - platform: template
    name: "Radar Factory Calibration"
    id: radar_factory_cal_text
    icon: "mdi:tune-variant"
    update_interval: 1s
    # 3.5：狀態沒變就不送（原本每秒送一次相同的字，佔掉一個實體每秒一筆事件、全是重複）
    # 3.8：固定代碼 running／success／failed／none（網頁自己翻譯）；結束後保留上次結果，完成時間另送 Radar Factory Calibration Finished At
    lambda: |-
      static std::string last = "none", shown;
      static bool running = false;
      int raw = id(ld2410_hub)->get_target_state_raw();
      std::string want;
      if (raw == 4) { running = true; want = "running"; }
      else {
        if (raw == 5 || raw == 6 || running) {
          if (raw == 5) last = "success"; else if (raw == 6) last = "failed";
          auto tm = id(sntp_time).now();
          if (tm.is_valid()) id(factory_cal_finished_at).publish_state(ESPTime::from_epoch_utc(tm.timestamp).strftime("%Y-%m-%dT%H:%M:%SZ"));
        }
        running = false;
        want = last;
      }
      if (want == shown) return {};
      shown = want;
      return want;
  - platform: template
    name: "Calibration Status"
    id: cal_status
    icon: "mdi:tune"
    # 3.3：人看的字串不變；機器讀的階段、預估結束時間與結果另外送
    on_value:
      - lambda: |-
          const std::string &s = x;
          auto st = [&](const char *p) { return s.rfind(p, 0) == 0; };
          float dl = id(cal_delay).state, du = id(cal_duration).state, sit = id(cal_sit_duration).state;
          float seat = id(cal_two).state ? sit + 10 : 0;
          const char *ph = nullptr; float rem = NAN; const char *fail = nullptr;
          // 3.8 還原校準：只動階段與「進行中」旗標，不碰上次校準的完成時間與結果
          if (st("Restor")) {
            bool r = st("Restoring");
            id(cal_phase_ts).publish_state(r ? "restoring" : "idle");
            id(cal_active_bs).publish_state(r);
            return;
          }
          if (st("Leave")) { ph = "wait_leave"; rem = dl + du + 3 + seat + 6; id(cal_total_s).publish_state(rem); }
          else if (st("Sampling")) { ph = "sampling_empty"; rem = du + 3 + seat + 6; }
          else if (st("Sit still")) { ph = "wait_seated"; rem = sit + 10 + 6; }
          else if (st("Seated")) { ph = "sampling_seated"; rem = sit + 6; }
          else if (st("Writing")) { ph = "writing"; rem = id(cal_two).state ? 6 : 3; }
          else if (st("Verifying")) { ph = "verifying"; rem = 3; }
          else if (st("Done")) ph = id(cal_unstable) ? "done_warning" : "done";
          else if (st("Failed: radar parameters")) { ph = "failed"; fail = "params_not_read"; }
          else if (st("Failed")) { ph = "failed"; fail = "no_data"; }
          else if (st("Aborted: unstable")) { ph = "aborted"; fail = "unstable"; }
          else if (st("Aborted")) { ph = "aborted"; fail = "someone_in_room"; }
          else if (st("Cancelled")) { ph = "cancelled"; fail = "cancelled"; }
          if (ph == nullptr) return;
          id(cal_phase_ts).publish_state(ph);
          bool active = !std::isnan(rem);
          id(cal_active_bs).publish_state(active);
          auto tm = id(sntp_time).now();
          id(cal_ends_at).publish_state(active && tm.is_valid() ? ESPTime::from_epoch_utc(tm.timestamp + (int) rem).strftime("%Y-%m-%dT%H:%M:%SZ") : std::string());
          if (active) return;
          if (tm.is_valid()) id(cal_finished_at).publish_state(ESPTime::from_epoch_utc(tm.timestamp).strftime("%Y-%m-%dT%H:%M:%SZ"));
          id(cal_fail_ts).publish_state(fail ? fail : "none");
          if (fail) return;
          id(calibration_done).turn_on();
          id(cr_samples).publish_state(id(cal_samples));
          id(cr_used_hist).publish_state(id(cal_used_hist));
          id(cr_seat_skipped).publish_state(id(cal_skip_sit));
          id(cr_seat_gates).publish_state(id(cal_sit_n) > 0 ? id(cal_seat_sig) : 0);
          id(cr_seat_seen).publish_state(id(cal_verify) == 1);
  # 只給網頁顯示，不進 HA，免得每 10 秒多一筆歷史
  - platform: template
